                {wordFormField("commentary", "② 말씀 해설", { rows: 4, ph: "본문을 이해하도록 돕는 설명" })}
                {wordFormField("key_verse", "② 핵심 구절", { rows: 2, ph: "9 이르되 내가 반드시 너와 함께 가리라" })}
                {wordFormField("qs", "③ 묵상 질문 (선택 — 한 줄에 하나, 최대 6개. 비우면 갈래별 6문항이 나옵니다)", { rows: 3, ph: "1. 하나님은 왜 이 사람을 부르셨습니까?\n2. 내가 머뭇거리는 순종은 무엇입니까?" })}
                {wordFormField("guide", "④ 오늘의 한 걸음 (선택 — 적용하기 단계에 실천 안내로 보입니다)", { rows: 2 })}
                {wordFormField("prayer", "⑤ 기도문 예시", { rows: 3 })}
                {wordFormField("video_url", "🎬 설교 영상 주소 (선택 — 유튜브 '공유'에서 복사한 주소)", { ph: "https://youtu.be/…" })}
                {filled(wordForm.video_url) && (ytId(wordForm.video_url)
                  ? <div className="yt-preview"><p className="form-hint" style={{ color: "#0d6a46", margin: "0 0 6px" }}>✓ 유튜브 영상을 찾았습니다 — 맞는 영상인지 확인해 주세요</p><YouTubeBox url={wordForm.video_url} /></div>
                  : <p className="auth-err" style={{ marginTop: 6 }}>유튜브 주소로 보이지 않습니다.</p>)}
                <p className="form-hint">저작권을 생각해 본문은 그날 묵상할 몇 절 정도만 넣어 주세요. 출처(개역개정 © 대한성서공회)는 자동으로 붙습니다.</p>
                <div className="form-actions">
                  <button className="primary" onClick={saveWord}>{wordForm.id ? "수정 저장" : "말씀 올리기"}</button>
                  <button className="ghost" onClick={() => { setWordForm(null); setWordErr(""); }}>취소</button>
                </div>
              </section>
            )}

            {w && (() => {
              const list = meditators[w.id];
              if (!list || list === "nosql") return isAdmin && list === "nosql"
                ? <p className="form-hint" style={{ marginBottom: 18 }}>관리자 안내: 묵상한 사람 명단을 보려면 Supabase에서 '묵상이음-회원현황.sql'을 실행해 주세요.</p> : null;
              const doneL = list.filter((x) => x.done), ingL = list.filter((x) => !x.done);
              return (
                <section className="word-shared meditators">
                  <h3>이 말씀으로 묵상한 사람 <small>마침 {doneL.length}명{ingL.length ? ` · 묵상 중 ${ingL.length}명` : ""}</small></h3>
                  {list.length === 0 ? <p className="muted">아직 아무도 묵상하지 않았습니다. 첫 번째로 묵상해 보세요.</p> : (
                    <div className="who-list">
                      {doneL.map((x) => <span key={x.user_id} className={"who done" + (x.user_id === user.id ? " me" : "")}>✓ {x.name}</span>)}
                      {ingL.map((x) => <span key={x.user_id} className={"who" + (x.user_id === user.id ? " me" : "")}>{x.name}</span>)}
                    </div>
                  )}
                </section>
              );
            })()}

            {w && (
              <section className="word-shared">
                <h3>함께 나눈 묵상 <small>{sharedOnWord.length}편</small></h3>
                {sharedOnWord.length === 0 ? (
                  <p className="muted">아직 나눈 묵상이 없습니다. 묵상노트 마지막에서 '교회와 나누기'를 고르면 이곳에 함께 보입니다.</p>
                ) : (
                  <ul className="shared-list">
                    {sharedOnWord.map((s) => (
                      <li key={s.id}>
                        <button onClick={() => { setLibrary("shared"); setQuery(""); setFYear("전체"); setFTag("전체"); setView("list"); setOpenId(s.id); if (!comments[s.id]) loadComments(s.id); }}>
                          <span className="sh-head">
                            <b>{s.author || "이름 없음"}</b>
                            {amenCount(s.id) > 0 && <span className="pill amen">아멘 {amenCount(s.id)}</span>}
                          </span>
                          {filled(mainAnswer(s)) && <span className="sh-title">{mainAnswer(s)}</span>}
                          {filled(s.apply) && <span className="peek">적용 · {s.apply}</span>}
                        </button>
                      </li>
                    ))}
                  </ul>
                )}
              </section>
            )}

            {isAdmin && audWords.length > 0 && (
              <section className="word-shared">
                <h3>올린 {AUDIENCES[audience]} 말씀 <small>관리자만 보입니다 · 최근 {Math.min(audWords.length, 14)}개</small></h3>
                <ul className="admin-words">
                  {audWords.slice(0, 14).map((x) => (
                    <li key={x.id}>
                      <button className="link" onClick={() => setWordDate(x.date)}>
                        <span className="date">{prettyDate(x.date)}</span> <span className="scripture">{wordLabel(x)}</span> {x.title}
                      </button>
                      <button className="aw-del" aria-label="이 말씀 삭제" onClick={() => deleteWord(x)}>삭제</button>
                    </li>
                  ))}
                </ul>
              </section>
            )}
          </main>
        );
      })()}

      {/* ───────── 오늘의 묵상 : 단계 ───────── */}
      {loaded && view === "today" && flowStep !== null && currentWord && (() => {
        const w = currentWord;
        const step = STEPS[flowStep];
        const verses = splitVerses(verseOnly(w.verse));
        const last = flowStep === STEPS.length - 1;
        const hlVerses = verses.filter((v) => v.n !== null && draft.highlights.includes(v.n));
        return (
          <main className={"container narrow flow" + (audOf(w) === "kids" ? " kids" : "")}>
            <div className="flow-top">
              <button className="text-link" onClick={async () => { await goStep(null); }}>‹ 오늘의 묵상</button>
              <span className="flow-ref">{wordLabel(w)}</span>
              <span className="flow-save">{saving}</span>
            </div>

            <ol className="stepper">
              {STEPS.map((s, i) => (
                <li key={s.k} className={(i === flowStep ? "cur " : "") + (i < flowStep ? "past" : "")}>
                  <button onClick={() => goStep(i)} aria-label={s.n}><i>{i + 1}</i><span>{s.s}</span></button>
                </li>
              ))}
            </ol>

            <h2 className="flow-title"><small>{flowStep + 1}단계</small>{step.n}</h2>

            {/* 1. 말씀 읽기 */}
            {step.k === "read" && (
              <section className="flow-card">
                <div className="read-tools">
                  <div className="font-tools" role="group" aria-label="글자 크기">
                    <button onClick={() => setFontSize((f) => Math.max(14, f - 2))} aria-label="글자 작게">가<sup>−</sup></button>
                    <button onClick={() => setFontSize((f) => Math.min(30, f + 2))} aria-label="글자 크게">가<sup>+</sup></button>
                  </div>
                  <button className={"tool-btn" + (hlMode ? " on" : "")} onClick={() => setHlMode(!hlMode)}>🖍 형광펜{hlMode ? " 켜짐" : ""}</button>
                  {canSpeak && (
                    <button className={"tool-btn" + (speaking ? " on" : "")} onClick={() => {
                      if (speaking) { stopSpeak(); setSpeaking(false); }
                      else { setSpeaking(true); speakKo(verses.map((v) => v.t).join(" "), () => setSpeaking(false)); }
                    }}>{speaking ? "■ 멈추기" : "🔊 음성 듣기"}</button>
                  )}
                </div>
                {hlMode && <p className="tool-hint">마음에 닿는 구절을 눌러 형광펜을 칠해 보세요. 다시 누르면 지워집니다.</p>}
                <div className="scripture-body" style={{ fontSize: (audOf(w) === "kids" ? fontSize + 2 : fontSize) + "px" }}>
                  {verses.map((v, i) => (
                    <p key={i} className={"vs" + (v.n !== null && draft.highlights.includes(v.n) ? " hl" : "") + (hlMode ? " can" : "")}
                      onClick={() => { if (hlMode && v.n !== null) toggleHl(v.n); }}>
                      {v.n !== null && <sup>{v.n}</sup>}<span className="vt">{v.t}</span>
                      {v.n !== null && draft.highlights.includes(v.n) && <span className="hl-tag" aria-label="표시한 구절">🖍</span>}
                    </p>
                  ))}
                </div>
                <p className="word-source">{BIBLE_SOURCE}</p>
                {isAdmin && !verses.some((v) => v.n !== null) && verseOnly(cleanVerse(w.verse)).length < 70 && (
                  <p className="form-hint" style={{ marginTop: 8, color: "#a33" }}>
                    관리자 안내: 본문 구절이 들어 있지 않은 것 같습니다. 교재 파일을 다시 가져오며 '덮어쓰기'를 켜거나, 홈의 '말씀 수정'에서 ① 본문을 넣어 주세요.
                  </p>
                )}
              </section>
            )}

            {/* 2. 말씀 이해하기 */}
            {step.k === "understand" && (
              <>
                {ytId(w.video_url) && (
                  <section className="flow-card video-card">
                    <h3 className="card-h">🎬 설교 영상</h3>
                    <YouTubeBox url={w.video_url} title={(w.title || wordLabel(w)) + " 설교"} />
                  </section>
                )}
                {filled(w.key_verse) && (
                  <section className="key-card">
                    <b>핵심 구절</b>
                    <p>{cleanVerse(w.key_verse)}</p>
                  </section>
                )}
                {filled(w.background) && (
                  <section className="flow-card">
                    <h3 className="card-h">본문 배경</h3>
                    {parasOf(w.background).map((p, i) => <p key={i} className="body-p">{p}</p>)}
                  </section>
                )}
                {filled(w.commentary) && (
                  <section className="flow-card">
                    <h3 className="card-h">말씀 해설</h3>
                    {parasOf(w.commentary).map((p, i) => <p key={i} className="body-p">{p}</p>)}
                  </section>
                )}
                {!filled(w.background) && !filled(w.commentary) && !filled(w.key_verse) && (
                  <section className="flow-card"><p className="muted">이 날은 해설이 없습니다. 본문을 한 번 더 천천히 읽어 보세요.</p></section>
                )}
              </>
            )}

            {/* 3. 묵상하기 */}
            {step.k === "meditate" && (
              <>
                {hlVerses.length > 0 && (
                  <section className="hl-recall">
                    <b>내가 표시한 구절</b>
                    {hlVerses.map((v) => <p key={v.n}><sup>{v.n}</sup>{v.t}</p>)}
                  </section>
                )}
                {(() => {
                  const g = GENRES[genreOf(w.book)];
                  const bq = bookQs(w.guide);
                  const kidsW = audOf(w) === "kids";
                  const qs = bq.length ? bq : kidsW ? KIDS_QS : g.qs;
                  const doneN = qs.filter((_, i) => filled(draft.answers[i])).length;
                  return (<>
                    <div className="genre-head">
                      <span className={"genre-chip g-" + genreOf(w.book)}>{bq.length ? "교재 묵상 질문" : kidsW ? "🌻 어린이 묵상" : g.name + " 묵상"}</span>
                      <span className="genre-count">{doneN} / {qs.length}</span>
                      <p>{kidsW ? KIDS_HINT : bq.length ? "오늘 교재에 담긴 질문으로 묵상합니다. 한 문장이라도 좋으니 솔직하게 적어 보세요." : g.hint}</p>
                    </div>
                    {qs.map((q, i) => (
                      <section className={"q-card" + (i === qs.length - 1 ? " q-last" : "")} key={i}>
                        <label>
                          <span className={"q-num" + (filled(draft.answers[i]) ? " ok" : "")}>{filled(draft.answers[i]) ? "✓" : i + 1}</span>
                          <span className="q-text">{q}</span>
                        </label>
                        <textarea rows={i === qs.length - 1 ? 4 : 3} value={draft.answers[i] || ""}
                          placeholder={i === qs.length - 1 ? "오늘 붙들 한 말씀을 적어 보세요." : "떠오르는 대로 짧게 적어도 좋습니다."}
                          onChange={(e) => { const a = [...draft.answers]; while (a.length < qs.length) a.push(""); a[i] = e.target.value; upd({ answers: a }); }} />
                      </section>
                    ))}
                  </>);
                })()}
              </>
            )}

            {/* 4. 적용하기 */}
            {step.k === "apply" && (
              <>
              {filled(applyHint(w.guide)) && (
                <section className="guide-card"><b>오늘의 한 걸음</b><p>{applyHint(w.guide)}</p></section>
              )}
              <section className="q-card apply-card">
                <label><span className="q-num">✓</span><span className="q-text">오늘 내가 실천할 한 가지</span></label>
                <p className="q-help">작고 구체적일수록 좋습니다. 언제, 어디서, 누구에게 할지 적어 보세요.</p>
                <textarea rows={4} value={draft.apply} placeholder="예: 점심시간에 미뤄 둔 사과 전화를 먼저 건다"
                  onChange={(e) => upd({ apply: e.target.value })} />
              </section>
              </>
            )}

            {/* 5. 기도하기 */}
            {step.k === "pray" && (
              <>
                {filled(w.prayer) && (
                  <section className="prayer-example">
                    <b>기도문 예시</b>
                    <p>{w.prayer}</p>
                    {!filled(draft.prayer) && (
                      <button className="text-link" onClick={() => upd({ prayer: w.prayer })}>이 기도로 시작해서 고쳐 쓰기</button>
                    )}
                  </section>
                )}
                <section className="q-card">
                  <label><span className="q-num">🙏</span><span className="q-text">나의 기도</span></label>
                  <textarea rows={7} value={draft.prayer} placeholder="오늘 받은 말씀을 붙들고 하나님께 드리는 기도를 적어 보세요."
                    onChange={(e) => upd({ prayer: e.target.value })} />
                </section>
              </>
            )}

            {/* 6. 묵상노트 */}
            {step.k === "note" && (
              <>
                <section className="note-paper">
                  <div className="note-head"><img src={SYMBOL_IMG} alt="" /><span>묵상노트</span><em>{prettyDate(w.date)}</em></div>
                  <textarea value={draft.content} style={{ fontSize: Math.max(16, fontSize - 1) + "px" }}
                    placeholder="말씀 앞에서 떠오른 생각, 감사, 질문, 하나님께 드리고 싶은 말… 무엇이든 자유롭게 적어 보세요."
                    onChange={(e) => upd({ content: e.target.value })} />
                </section>
                <section className="share-choice">
                  <b>이 묵상을</b>
                  <div className="seg">
                    <button className={draft.scope === "personal" ? "on" : ""} onClick={() => upd({ scope: "personal" })}>나만 보기</button>
                    <button className={draft.scope === "shared" ? "on" : ""} onClick={() => upd({ scope: "shared" })}>교회와 나누기</button>
                  </div>
                  <p className="q-help">{draft.scope === "shared"
                    ? "묵상 질문의 답·적용·기도·노트가 '나눔'에 이름과 함께 보입니다. 지체들이 아멘과 댓글로 응답할 수 있습니다."
                    : "나만 볼 수 있습니다. 나중에 언제든 나눔으로 바꿀 수 있습니다."}</p>
                </section>
              </>
            )}

            <div className="flow-nav">
              <button className="ghost" disabled={flowStep === 0} onClick={() => goStep(flowStep - 1)}>‹ 이전</button>
              {last
                ? <button className="primary" onClick={finishFlow}>{draft.done ? "저장하기" : "묵상 마치기"}</button>
                : <button className="primary" onClick={() => goStep(flowStep + 1)}>다음 · {STEPS[flowStep + 1].s} ›</button>}
            </div>
          </main>
        );
      })()}

      {/* ───────── 전체 관리자: 교회 관리 ───────── */}
      {loaded && view === "churches" && isSuper && (
        <main className="container narrow">
          <h2 className="page-title">교회 관리 <small style={{ fontSize: 13, color: "var(--muted)" }}>전체 관리자만 보입니다</small></h2>
          {churchList === null ? <p className="muted">불러오는 중…</p> : (
            <div className="member-table-wrap">
              <table className="member-table">
                <thead><tr><th>교회</th><th>초대 코드</th><th>회원</th><th></th></tr></thead>
                <tbody>
                  {churchList.map((c) => (
                    <tr key={c.id}>
                      <td><b>{c.name}</b></td><td><code>{c.code}</code></td><td>{Number(c.members)}명</td>
                      <td>{church && church.id === c.id ? <span className="pill shared">지금 보는 교회</span>
                        : <button className="text-link" onClick={() => joinChurch({ p_church: c.id })}>이 교회로 가기</button>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <div className="join-row" style={{ marginTop: 14 }}>
            <input value={newChurch} placeholder="새 교회 이름 (예: 은혜교회)" onChange={(e) => setNewChurch(e.target.value)} />
            <button className="primary" onClick={makeChurch}>교회 만들기</button>
          </div>
          {joinErr && <p className="auth-err">{joinErr}</p>}
          <p className="form-hint" style={{ marginTop: 10 }}>
            교회를 만들면 초대 코드가 생깁니다. 그 교회 담당자가 가입해 코드로 들어오면, '가입자 현황'에서 '관리자로'를 눌러 그 교회 관리자로 정해 주세요.
            교회 관리자는 자기 교회의 말씀 올리기·가입자 현황·나눔 삭제를 할 수 있습니다.
          </p>
        </main>
      )}

      {/* ───────── 교회 관리자 화면: 장년부 / 어린이 명단 ───────── */}
      {loaded && view === "members" && isAdmin && (() => {
        const L = Array.isArray(memberStats) ? memberStats : [];
        const ago = (iso) => {
          if (!iso) return "—";
          const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
          return d <= 0 ? "오늘" : d === 1 ? "어제" : d < 30 ? `${d}일 전` : new Date(iso).toLocaleDateString("ko-KR");
        };
        const deptOf = (m) => (m.dept === "kids" ? "kids" : "adult");
        const t = today(), wk = shiftDate(t, -6);
        const tab = memberTab;
        const T = L.filter((m) => deptOf(m) === tab);
        const activeWeek = T.filter((m) => m.last_date && m.last_date >= wk && m.last_date <= t).length;
        const todayN = T.filter((m) => m.last_date === t).length;
        const rows = [...T].sort((a, b) => String(b.last_date || "").localeCompare(String(a.last_date || "")) || String(a.name).localeCompare(String(b.name)));
        const wkAgo = Date.now() - 7 * 86400000;
        const fresh = L.filter((m) => m.church_joined_at && new Date(m.church_joined_at).getTime() > wkAgo)
          .sort((a, b) => String(b.church_joined_at).localeCompare(String(a.church_joined_at)));
        const nA = L.filter((m) => deptOf(m) === "adult").length, nK = L.length - nA;
        return (
          <main className={"container admin-wide" + (tab === "kids" ? " kids" : "")}>
            <div className="dash-head">
              <h2 className="page-title">관리자 화면 <small style={{ fontSize: 13, color: "var(--muted)" }}>{church && church !== "legacy" ? church.name + " · " : ""}교회 관리자만 보입니다</small></h2>
              <button className="ghost sm" onClick={loadMemberStats}>새로 보기</button>
            </div>
            {adminChurches.length > 1 && (
              <div className="admin-switch">
                <span>내가 관리하는 교회</span>
                {adminChurches.map((c) => (
                  <button key={c.id} className={"ghost" + (church && church.id === c.id ? " on" : "")}
                    onClick={() => { if (!(church && church.id === c.id)) joinChurch({ p_church: c.id }).then(() => { setView("members"); loadMemberStats(); }); }}>{c.name}</button>
                ))}
              </div>
            )}
            {church && church !== "legacy" && church.code && (
              <div className="invite-box">
                <span>교인 초대 코드</span><b>{church.code}</b>
                <small>교인에게 이 코드를 알려 주세요. 가입·로그인 뒤 코드를 넣고 부서(장년부/어린이)를 고르면 {church.name}에 바로 들어옵니다.</small>
              </div>
            )}
            {memberStats === "loading" && <p className="muted">불러오는 중…</p>}

                  <div className="who-list" style={{ marginTop: 8 }}>

              <div className="aud-toggle dept-tabs" role="tablist">
                <button role="tab" aria-selected={tab === "adult"} className={tab === "adult" ? "on adult" : ""} onClick={() => setMemberTab("adult")}>📖 장년부 명단 <b>{nA}</b></button>
                <button role="tab" aria-selected={tab === "kids"} className={tab === "kids" ? "on kids" : ""} onClick={() => setMemberTab("kids")}>🌻 어린이 명단 <b>{nK}</b></button>
              </div>
              <div className="stat-row">
                <div className="stat"><b>{T.length}<i>명</i></b><span>{AUDIENCES[tab]} 교인</span></div>
                <div className="stat"><b>{todayN}<i>명</i></b><span>오늘 묵상</span></div>
                <div className="stat"><b>{activeWeek}<i>명</i></b><span>최근 7일 묵상</span></div>
              </div>
              {T.length === 0 ? <p className="muted" style={{ margin: "14px 0" }}>{AUDIENCES[tab]} 교인이 아직 없습니다.</p> : (
                <div className="member-table-wrap">
                  <table className="member-table">
                    <thead><tr><th>이름</th><th>교회 들어온 날</th><th>최근 접속</th><th>묵상</th><th>마지막 묵상</th>{church !== "legacy" && <th>관리</th>}</tr></thead>
                    <tbody>
                      {rows.map((m) => (
                        <tr key={m.user_id}>
                          <td><b>{m.name}</b>{m.role === "admin" && <span className="pill shared" style={{ marginLeft: 6 }}>관리자</span>}{m.email && <small>{m.email}</small>}</td>
                          <td>{(m.church_joined_at || m.joined_at) ? new Date(m.church_joined_at || m.joined_at).toLocaleDateString("ko-KR") : "—"}</td>
                          <td>{ago(m.last_seen)}</td>
                          <td>{Number(m.total)}회{Number(m.done) !== Number(m.total) && <small>마침 {Number(m.done)}</small>}</td>
                          <td>{m.last_date ? prettyDate(m.last_date) : "—"}</td>
                          {church !== "legacy" && (
                            <td>
                              <button className="text-link" onClick={() => setDept(m, tab === "kids" ? "adult" : "kids")}>{tab === "kids" ? "장년부로" : "어린이로"}</button>
                              {m.user_id === user.id || (m.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase()
                                ? null : <> · <button className="text-link danger-text" onClick={() => removeMember(m)}>삭제</button></>}
                            </td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              <p className="form-hint" style={{ marginTop: 10 }}>교인은 교회에 들어올 때 부서를 고르고, 관리자가 '장년부로/어린이로'로 옮길 수 있습니다. 묵상 내용은 여기 보이지 않고 횟수만 셉니다.
                '삭제'는 그 사람을 이 교회에서 빼고 이 교회에 쓴 묵상을 지웁니다. 로그인 계정은 남습니다.</p>
            </>)}
          </main>
        );
      })()}

      {/* ───────── 묵상 캘린더 ───────── */}
      {loaded && view === "calendar" && (() => {
        const mine = items.filter((x) => x.mine);
        const byDate = {};
        mine.forEach((x) => { if (x.date) (byDate[x.date] = byDate[x.date] || []).push(x); });
        const wordDates = new Set(audWords.map((x) => x.date));
        const cells = monthCells(calMonth);
        const [cy, cm] = calMonth.split("-").map(Number);
        const monthRecs = mine.filter((x) => (x.date || "").startsWith(calMonth)).sort((a, b) => a.date.localeCompare(b.date));
        const doneDays = new Set(monthRecs.filter((x) => x.done || !x.wordId).map((x) => x.date));
        return (
          <main className="container narrow">
            <h2 className="page-title">묵상 캘린더</h2>
            <div className="stat-row">
              <div className="stat"><b>{stats.streak}<i>일</i></b><span>연속 묵상</span></div>
              <div className="stat"><b>{doneDays.size}<i>일</i></b><span>{cm}월에 묵상한 날</span></div>
            </div>
            <section className="cal">
              <div className="cal-head">
                <button className="round-btn" onClick={() => setCalMonth(shiftMonth(calMonth, -1))} aria-label="이전 달">‹</button>
                <b>{cy}년 {cm}월</b>
                <button className="round-btn" onClick={() => setCalMonth(shiftMonth(calMonth, 1))} aria-label="다음 달">›</button>
              </div>
              <div className="cal-grid">
                {["일", "월", "화", "수", "목", "금", "토"].map((d, i) => <span key={d} className={"cal-dow" + (i === 0 ? " sun" : "")}>{d}</span>)}
                {cells.map((d, i) => {
                  if (!d) return <span key={i} className="cal-cell empty" />;
                  const recs = byDate[d] || [];
                  const done = recs.some((x) => x.done || !x.wordId);
                  const started = recs.length > 0 && !done;
                  return (
                    <button key={i}
                      className={"cal-cell" + (done ? " done" : "") + (started ? " started" : "") + (d === today() ? " today" : "") + (i % 7 === 0 ? " sun" : "")}

                      <span className="cal-num">{Number(d.slice(8))}</span>
                      {done ? <span className="cal-mark">✓</span> : started ? <span className="cal-dot half" /> : wordDates.has(d) ? <span className="cal-dot" /> : null}
                    </button>
                  );

              </div>
              <div className="cal-legend">
                <span><i className="lg done">✓</i>묵상 완료</span>
                <span><i className="lg started" />하는 중</span>

                <ul className="shared-list">
                  {monthRecs.map((s) => (
                    <li key={s.id}>
                      <button onClick={() => {
                        if (s.wordId && words.some((x) => x.id === s.wordId)) { setWordDate(s.date); setView("today"); }

                      }}>
                        <span className="sh-head"><b>{prettyDate(s.date)}</b>{s.done && <span className="pill word">완료</span>}{s.scope === "shared" && <span className="pill shared">나눔</span>}</span>
                        <span className="sh-title">{s.title}</span>
                        {filled(s.apply) && <span className="peek">적용 · {s.apply}</span>}
                      </button>
                    </li>
                  ))}
                </ul>
              )}
            </section>
          </main>
        );
      })()}

      {/* ───────── 묵상 목록 ───────── */}
      {loaded && (view === "list" || view === "map") && (
        <div className="container rec-mode-bar">
          <div className="aud-toggle sm rec-mode">
            <button className={listMode !== "map" && view !== "map" ? "on" : ""} onClick={() => { setListMode("list"); setView("list"); }}>📋 묵상 목록</button>
            <button className={listMode === "map" || view === "map" ? "on" : ""} onClick={() => { setMapBook(null); setListMode("map"); setView("list"); }}>🗺️ 묵상 지도</button>
          </div>
        </div>
      )}

      {loaded && view === "list" && listMode !== "map" && (
        <main className="container">
          {library === "personal" && (
            <div className="stat-row">
              <div className="stat"><b>{stats.streak}<i>일</i></b><span>연속 묵상</span></div>
              <div className="stat"><b>{stats.monthDays}<i>일</i></b><span>이번 달 묵상한 날</span></div>
              <div className="stat"><b>{stats.total}</b><span>전체 묵상</span></div>
              <div className="stat"><b>{stats.shared}</b><span>나눈 묵상</span></div>
            </div>
          )}

          <div className="toolbar">
            <input className="search" placeholder="말씀·묵상·적용·기도·이름으로 검색"
              value={query} onChange={(e) => setQuery(e.target.value)} />
            <div className="filters">
              <select value={fYear} onChange={(e) => setFYear(e.target.value)}>
                {years.map((y) => <option key={y} value={y}>{y === "전체" ? "연도: 전체" : y + "년"}</option>)}
              </select>
              <select value={fTag} onChange={(e) => setFTag(e.target.value)}>
                {allTags.map((t) => <option key={t} value={t}>{t === "전체" ? "주제: 전체" : "#" + t}</option>)}
              </select>
            </div>
          </div>

            {scoped.length ? `${filtered.length}편 표시 · ${library === "personal" ? "내 묵상" : "함께 나눔"} ${scoped.length}편` : ""}
          </p>

          {scoped.length === 0 && (
            <div className="empty">
              <p className="empty-title">{library === "personal" ? "아직 기록한 묵상이 없습니다." : "아직 나눔에 올라온 묵상이 없습니다."}</p>
              <p>위의 <b>+ 묵상 쓰기</b>를 눌러 오늘 받은 말씀을 적어 보세요.<br />
              나눔으로 공개하면 함께하는 지체들이 읽고 <b>아멘</b>과 댓글로 응답할 수 있습니다.</p>
            </div>

          <ul className="cards">
            {filtered.map((s) => {
              const open = openId === s.id;

                <li key={s.id} className={"card" + (open ? " open" : "")}>
                  <button className="card-head" onClick={() => toggleOpen(s)}>
                    <div className="card-main">
                      <span className="scripture">{label(s)}</span>
                      <span className="card-title">{s.title}</span>
                      {!open && (filled(mainAnswer(s)) || s.content) && <span className="peek">{filled(mainAnswer(s)) ? mainAnswer(s) : s.content}</span>}
                    </div>
                    <div className="card-meta">
                      {s.wordId && <span className="pill word">{s.done ? "묵상 완료" : "묵상 중"}</span>}
                      {library === "shared" && <span className="pill author">{s.author || "이름 없음"}</span>}
                      {library === "personal" && s.scope === "shared" && <span className="pill shared">나눔</span>}
                      {s.scope === "shared" && amenCount(s.id) > 0 && <span className="pill amen">아멘 {amenCount(s.id)}</span>}
                      <span className="date">{s.date || "날짜 없음"}</span>
                    </div>
                  </button>

                  {open && (
                    <div className="card-body">
                      {s.wordId ? (<>
                        {questionsFor(s.book, s.answers, words.find((x) => x.id === s.wordId)).map((q, i) => (
                          <Section key={i} name={(NUM[i] || "") + " " + q} text={(s.answers || [])[i]} />
                        ))}
                        <Section name="오늘 실천할 한 가지" text={s.apply} cls="verse" />
                        <Section name="나의 기도" text={s.prayer} cls="prayer" />
                        <Section name="묵상노트" text={s.content} />
                      </>) : (<>
                      <Section name={s.wordId ? "오늘의 말씀" : "말씀"} text={s.verse} cls="verse" />
                      {s.verse && <p className="word-source" style={{ marginTop: -6 }}>{BIBLE_SOURCE}</p>}
                      <Section name="묵상" text={s.content} />
                      <Section name="적용" text={s.apply} />
                      <Section name="기도" text={s.prayer} cls="prayer" />
                      </>)}
                      {(s.tags || []).length > 0 && (
                        <div className="tag-row">
                          {s.tags.map((t) => <button key={t} className="tag" onClick={() => { setFTag(t); setOpenId(null); }}>#{t}</button>)}
                        </div>
                      )}

                      {s.scope === "shared" && (
                        <div className="share-box">
                          <button className={"amen-btn" + (iAmened(s.id) ? " on" : "")} onClick={() => toggleAmen(s.id)}>
                            🙏 아멘 {amenCount(s.id) || ""}

                          <ul className="comments">
                            {(comments[s.id] || []).map((c) => (
                              <li key={c.id}>
                                <b>{c.author_name || "이름 없음"}</b>
                                <span>{c.body}</span>
                                {(c.user_id === user.id || isAdmin) && (
                                  <button className="text-link danger-text" onClick={() => deleteComment(s.id, c.id)}>지우기</button>
                                )}
                              </li>
                            ))}

                          <div className="comment-input">
                            <input placeholder="격려와 응답을 남겨주세요"
                              value={commentInput[s.id] || ""}
                              onChange={(e) => setCommentInput((p) => ({ ...p, [s.id]: e.target.value }))}
                              onKeyDown={(e) => { if (e.key === "Enter") addComment(s.id); }} />
                            <button className="ghost" onClick={() => addComment(s.id)}>남기기</button>
                          </div>
                        </div>
                      )}

                      <div className="card-actions">
                        {s.mine ? (
                          <>
                            <button className="ghost" onClick={() => { if (s.wordId && words.some((x) => x.id === s.wordId)) { setWordDate(s.date); setView("today"); } else startEdit(s); }}>수정</button>
                            <button className="ghost danger-text" onClick={() => askRemove(s)}>삭제</button>
                          </>
                        ) : (
                          <>
                            <span className="muted">{s.author ? s.author + "님의 묵상" : "다른 지체의 묵상"}</span>
                            {isAdmin && <button className="ghost danger-text" onClick={() => askRemove(s)}>삭제 (관리자)</button>}
                          </>
                        )}
                      </div>
                    </div>
                  )}
                </li>
              );
            })}
          </ul>
          {scoped.length > 0 && filtered.length === 0 && (
            <div className="empty"><p>조건에 맞는 묵상이 없습니다. 검색어나 필터를 바꿔보세요.</p></div>
          )}
        </main>
      )}

      {/* ───────── 쓰기 / 수정 ───────── */}
      {loaded && view === "form" && (
        <main className="container narrow">

          <div className="row">

              <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />

              <select value={saveScope} onChange={(e) => setSaveScope(e.target.value)}>
                <option value="personal">나만 보기</option>

              </select>
            </label>
          </div>

          <div className="row">
            <label className="field"><span>본문 성경</span>
              <select value={form.book} onChange={(e) => setForm({ ...form, book: e.target.value })}>
                <option value="">선택</option>
                <optgroup label="구약">{OT_BOOKS.map((b) => <option key={b}>{b}</option>)}</optgroup>
                <optgroup label="신약">{NT_BOOKS.map((b) => <option key={b}>{b}</option>)}</optgroup>
              </select>
            </label>
            <label className="field"><span>장·절</span>
              <input value={form.ref} onChange={(e) => setForm({ ...form, ref: e.target.value })} placeholder="예: 23:1-6" />
            </label>
          </div>

          <label className="field"><span>붙잡은 말씀 (마음에 머문 한두 절 정도만 적어 주세요)</span>
            <textarea rows={3} value={form.verse} onChange={(e) => setForm({ ...form, verse: e.target.value })}
              placeholder="오늘 마음에 머문 구절을 적어 보세요." />
          </label>

          <label className="field"><span>제목 (비우면 본문 말씀으로 채워집니다)</span>
            <input value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="예: 부족함이 없는 삶" />
          </label>
          <label className="field"><span>묵상 — 말씀이 내게 하신 말씀</span>
            <textarea rows={8} value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })}
              placeholder="깨달은 것, 느낀 것, 하나님은 어떤 분이신지…" />
          </label>
          <label className="field"><span>적용 — 오늘 살아낼 한 가지</span>
            <textarea rows={3} value={form.apply} onChange={(e) => setForm({ ...form, apply: e.target.value })} />
          </label>
          <label className="field"><span>기도</span>
            <textarea rows={3} value={form.prayer} onChange={(e) => setForm({ ...form, prayer: e.target.value })} />
          </label>
          <label className="field"><span>주제 (쉼표로 구분)</span>
            <input value={form.tags} onChange={(e) => setForm({ ...form, tags: e.target.value })} placeholder="예: 신뢰, 평안, 감사" />
          </label>

          <div className="form-actions">
            <button className="primary" disabled={!form.content.trim() && !form.title.trim()} onClick={saveForm}>
              {editingId ? "수정 저장" : "저장"}
            </button>
            <button className="ghost" onClick={() => setView("list")}>취소</button>
          </div>
        </main>
      )}

      {/* ───────── 성경 지도 ───────── */}
      {/* ───────── 묵상 지도: 기존 성경 지도 틀 그대로, 묵상한 책만 (구약 / 신약) ───────── */}
      {loaded && ((view === "list" && listMode === "map") || view === "map") && (
        <main className="container">
          <h2 className="page-title">묵상 지도</h2>
          <p className="map-sub">{library === "personal" ? "내가" : "공동체가"} 묵상한 말씀이 성경 어디에 머물렀는지 보여줍니다. 색이 진할수록 자주 묵상한 책입니다.</p>
          {[["구약", OT_BOOKS], ["신약", NT_BOOKS]].map(([tName, list]) => {
            const books = list.filter((n) => (bookCounts[n] || 0) > 0);
            if (!books.length) return null;
            const total = books.reduce((a, n) => a + (bookCounts[n] || 0), 0);
            return (
              <section key={tName} className="testament">
                <h3 className="testament-head"><span className="testament-name">{tName}</span><span className="testament-count">{total}편</span></h3>
                <div className="book-grid med-grid">
                  {books.map((name) => {
                    const c = bookCounts[name] || 0;
                    const inv = c / maxBook > 0.5;
                    return (
                      <button key={name} className={"book-cell" + (mapBook === name ? " sel" : "")}
                        style={{ background: heat(c, maxBook) }}
                        onClick={() => setMapBook(mapBook === name ? null : name)}>
                        <span className={"book-name" + (inv ? " inv" : "")}>{name}</span>
                        <span className={"book-num" + (inv ? " inv" : "")}>{c}</span>
                      </button>
                    );
                  })}
                </div>
              </section>
            );
          })}
          {!OT_BOOKS.concat(NT_BOOKS).some((n) => (bookCounts[n] || 0) > 0) && <p className="muted">아직 묵상한 말씀이 없습니다.</p>}
          {mapBook && (bookCounts[mapBook] || 0) > 0 && (
            <div className="detail">
              <h3>{mapBook} <small>{bookCounts[mapBook] || 0}편</small></h3>
              <MiniList list={scoped.filter((s) => s.book === mapBook)} />
            </div>
          )}
        </main>
      )}

      {false && loaded && view === "map" && (
        <main className="container">
          <h2 className="page-title">성경 지도 <small style={{ fontSize: 13, color: "var(--muted)" }}>지금까지 묵상한 본문</small></h2>
          <p className="map-sub">{library === "personal" ? "내가" : "공동체가"} 지금까지 묵상한 본문이 성경 어디에 머물렀는지 보여줍니다. 색이 진할수록 자주 묵상한 책이고, 책을 누르면 그 책에서 묵상한 본문(장·절)이 나옵니다.</p>
          {BIBLE_SECTIONS.map((sec) => {
            const total = sec.groups.reduce((a, g) => a + g.books.reduce((b, n) => b + (bookCounts[n] || 0), 0), 0);
            return (
              <section key={sec.testament} className="testament">
                <h3 className="testament-head"><span className="testament-name">{sec.testament}</span><span className="testament-count">{total}편</span></h3>
                <div className="bible-columns">
                  {sec.groups.map((g) => (
                    <div key={g.name}>
                      <div className="group-name">{g.name}</div>
                      <div className="book-grid">
                        {g.books.map((name) => {
                          const c = bookCounts[name] || 0;
                          const inv = c / maxBook > 0.5;
                          return (
                            <button key={name} className={"book-cell" + (mapBook === name ? " sel" : "")}
                              style={{ background: heat(c, maxBook) }}
                              onClick={() => setMapBook(mapBook === name ? null : name)}>
                              <span className={"book-name" + (inv ? " inv" : "")}>{name}</span>
                              <span className={"book-num" + (inv ? " inv" : "")}>{c || ""}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            );
          })}
          {mapBook && (
            <div className="detail">
              <h3>{mapBook} <small>{bookCounts[mapBook] || 0}편</small></h3>
              {(bookCounts[mapBook] || 0) > 0 && (
                <div className="ref-chips">
                  {[...new Set(scoped.filter((s) => s.book === mapBook && filled(s.ref)).map((s) => s.ref))]
                    .sort((a, b) => (parseInt(a) - parseInt(b)) || String(a).localeCompare(String(b), "ko", { numeric: true }))
                    .map((r) => <span key={r} className="ref-chip">{mapBook} {r}</span>)}
                </div>
              )}
              {(bookCounts[mapBook] || 0) === 0
                ? <p className="muted">아직 이 책으로 묵상한 기록이 없습니다.</p>
                : <MiniList list={scoped.filter((s) => s.book === mapBook)} />}
            </div>
          )}
        </main>
      )}

      {/* ───────── 주제 ───────── */}
      {loaded && view === "topics" && (
        <main className="container">
          <h2 className="page-title">주제</h2>
          <p className="map-sub">묵상에 붙인 주제들입니다. 눌러서 그 주제로 묵상한 글을 모아 보세요.</p>
          {tagList.length === 0 ? (
            <div className="empty"><p>아직 주제가 붙은 묵상이 없습니다. 묵상을 쓸 때 주제를 적어 보세요.</p></div>
          ) : (
            <div className="book-grid">
              {tagList.map(([t, c]) => (
                <button key={t} className={"book-cell" + (topicSel === t ? " sel" : "")}
                  style={{ background: heat(c, maxTag) }} onClick={() => setTopicSel(topicSel === t ? null : t)}>
                  <span className={"book-name" + (c / maxTag > 0.5 ? " inv" : "")}>{t}</span>
                  <span className={"book-num" + (c / maxTag > 0.5 ? " inv" : "")}>{c}</span>
                </button>
              ))}
            </div>
          )}
          {topicSel && (
            <div className="detail">
              <h3>#{topicSel} <small>{tagCounts[topicSel]}편</small></h3>
              <MiniList list={scoped.filter((s) => (s.tags || []).includes(topicSel))} />
            </div>
          )}
        </main>
      )}

      <footer className="foot">묵상은 온라인 서버에 저장되어 어느 기기에서나 로그인하면 이어집니다. 가끔 메뉴의 '백업'도 해 두세요. · Ver. {APP_VERSION}</footer>
    </div>
  );
}

.flow-ref{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--accent);font-size:14px}
.flow-save{font-size:12px;color:var(--muted);min-width:52px;text-align:right}
.stepper{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:18px}
.stepper button{width:100%;background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.stepper i{font-style:normal;display:block;width:100%;height:5px;border-radius:3px;background:#dcece7;font-size:0}
.stepper span{font-size:11.5px;color:var(--muted)}
.stepper li.past i{background:#a2dac7}
.stepper li.cur i{background:var(--green)}
.stepper li.cur span{color:var(--green);font-weight:700}
.flow-title{font-family:'Noto Serif KR',serif;font-size:24px;color:var(--ink-deep);margin-bottom:14px}
.flow-title small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--accent);letter-spacing:.1em;margin-bottom:2px}
.flow-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px;margin-bottom:14px}
.card-h{font-size:14px;color:var(--accent);margin-bottom:8px}
.body-p{font-size:15.5px;line-height:1.9;margin-bottom:10px;word-break:keep-all}
.body-p:last-child{margin-bottom:0}

.read-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.font-tools{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.font-tools button{border:none;background:#fff;padding:7px 14px;font-family:'Noto Serif KR',serif;font-size:15px;color:var(--ink)}
.font-tools button+button{border-left:1px solid var(--line);font-size:18px}
.font-tools sup{font-size:10px;margin-left:1px}
.tool-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:13.5px;color:var(--ink)}
.tool-btn.on{background:#fff4c2;border-color:#e6c84d;color:#6b5200;font-weight:700}
.tool-hint{font-size:12.5px;color:#8a6d1f;background:#fff9df;border-radius:8px;padding:7px 10px;margin-bottom:10px}
.scripture-body{font-family:'Noto Serif KR',serif;line-height:2;color:#121916}
.scripture-body .vs{margin:0 0 6px;padding:2px 6px;border-radius:6px;word-break:keep-all;transition:background .15s}
.scripture-body .vs{position:relative}
.scripture-body .vs.can{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.scripture-body .vs.can:hover:not(.hl){background:#fbf3e4}
/* 형광펜: 글줄마다 같은 높이의 띠가 그려지도록 글자(인라인)에 칠함 */
.scripture-body .vs .vt{padding:0 1px}
.scripture-body .vs.hl .vt{background-image:linear-gradient(transparent 56%,#ffe46b 56%,#ffe46b 94%,transparent 94%);
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.scripture-body .hl-tag{font-size:.7em;margin-left:4px;vertical-align:1px}
.scripture-body sup,.hl-recall sup{font-size:.62em;color:var(--accent);font-weight:700;margin-right:4px;font-family:'Noto Sans KR',sans-serif}

.key-card{margin-bottom:14px;padding:20px;border-radius:16px;background:linear-gradient(160deg,#0d4b36,#093828);color:#fff;
  box-shadow:0 10px 24px rgba(9,58,42,.22)}
.key-card b{display:block;font-size:12px;letter-spacing:.14em;color:#c8f3e5;margin-bottom:8px}
.key-card p{font-family:'Noto Serif KR',serif;font-size:18px;line-height:1.85;word-break:keep-all}

.hl-recall{margin-bottom:14px;padding:12px 16px;border-radius:12px;background:#fffbea;border:1px solid #f1e3a6}
.hl-recall b{display:block;font-size:12px;color:#8a6d1f;margin-bottom:4px}
.hl-recall p{font-family:'Noto Serif KR',serif;font-size:14.5px;line-height:1.8}
.ask-back{position:fixed;inset:0;z-index:100;background:rgba(10,21,17,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.ask-box{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:22px 20px 16px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.ask-box p{font-size:15.5px;line-height:1.7;white-space:pre-wrap;margin:0 0 18px}
.ask-actions{display:flex;gap:8px;justify-content:flex-end}
.ask-actions button{min-width:84px}
.admin-words li{display:flex;align-items:center;gap:8px}
.admin-words li .link{flex:1;min-width:0;text-align:left}
.aw-del{flex:none;border:1px solid #e6c9c9;background:#fff;color:#a33;border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.guide-card{margin-bottom:14px;padding:12px 16px;border-radius:12px;border:1px dashed #d8cba4;background:#fffdf6}
.guide-card b{display:block;font-size:12px;color:var(--accent);margin-bottom:3px}
.guide-card p{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-bottom:14px}
.q-card label{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.q-num{flex-shrink:0;width:28px;height:28px;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center}
.q-text{font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;line-height:1.55;color:var(--ink-deep);padding-top:2px}
.q-help{font-size:13px;color:var(--muted);margin:-4px 0 10px;line-height:1.6}
.q-card textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.8;
  font-family:inherit;resize:vertical;background:#fcfffe}
.q-card textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(13,75,54,.10)}
.apply-card{border-color:#c6e8dd;background:linear-gradient(#fff,#f7fffc)}
.prayer-example{margin-bottom:14px;padding:16px 18px;border-radius:14px;background:#faf5ef;border:1px solid #ecdcc6}
.prayer-example b{display:block;font-size:12px;color:var(--accent);margin-bottom:6px}
.prayer-example p{font-family:'Noto Serif KR',serif;font-size:15px;line-height:1.9;color:#1e2825;margin-bottom:8px}

.note-paper{position:relative;border-radius:16px;overflow:hidden;border:1px solid #d2ebe3;margin-bottom:14px;
  background:#fffdf8;box-shadow:0 8px 20px rgba(9,58,42,.08)}
.note-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #d7f1e8;background:#effbf7}
.note-head img{width:26px;height:26px;object-fit:contain;mix-blend-mode:multiply}
.note-head span{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--green)}
.note-head em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.note-paper textarea{display:block;width:100%;min-height:300px;border:none;resize:vertical;padding:6px 18px 18px 46px;
  font-family:'Noto Serif KR',serif;line-height:2.1em;color:#161e1b;background-color:transparent;
  background-image:linear-gradient(90deg,transparent 34px,rgba(13,75,54,.25) 34px,rgba(13,75,54,.25) 35px,transparent 35px),
    repeating-linear-gradient(transparent 0,transparent calc(2.1em - 1px),#dcefe9 calc(2.1em - 1px),#dcefe9 2.1em);
  background-attachment:local;background-position:0 6px}
.note-paper textarea:focus{outline:none}
.share-choice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.share-choice b{display:block;font-size:13.5px;margin-bottom:8px}
.seg{display:flex;background:#ecf4f1;border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:10px;font-size:14.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--green);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.flow-nav{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;padding:14px 0 18px;
  background:linear-gradient(rgba(250,246,243,0),var(--paper) 30%)}
.flow-nav .ghost{background:#fff;padding:12px 18px;border-radius:24px}
.flow-nav .primary{flex:1;max-width:320px;margin-left:auto;border-radius:24px}
.flow-nav button:disabled{opacity:.35}
.form-hint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}

/* ── 캘린더 ── */
.cal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;margin-bottom:20px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-family:'Noto Serif KR',serif;font-size:19px;color:var(--ink-deep)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal-dow.sun,.cal-cell.sun .cal-num{color:#b3402f}
.cal-cell{aspect-ratio:1/1;border:none;background:#f6fbf9;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:0;position:relative}
.cal-cell.empty{background:none}
.cal-cell:hover{background:#e9f6f2}
.cal-num{font-size:14px;color:var(--ink)}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--green)}
.cal-cell.done{background:linear-gradient(#175943,#09412e)}
.cal-cell.done .cal-num{color:#fff;font-weight:700}
.cal-mark{font-size:11px;color:#d9fff2;line-height:1}
.cal-dot{width:6px;height:6px;border-radius:3px;background:#b3d9cc}
.cal-dot.half{background:var(--green)}
.cal-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.lg{display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.lg.done{width:16px;height:16px;border-radius:5px;background:#0d4b36;color:#fff;font-size:10px}
.lg.started{width:7px;height:7px;border-radius:4px;background:var(--green)}
.lg.word{width:7px;height:7px;border-radius:4px;background:#b3d9cc}
@media (max-width:640px){
  .today-title{font-size:23px}
  .step-track span,.stepper span{font-size:10.5px}
  .step-track i{width:30px;height:30px}
  .step-track::before{top:15px}
  .flow-title{font-size:21px}
  .cal-num{font-size:13px}
}

/* 갈래별 묵상 질문 */
.genre-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.genre-head p{flex-basis:100%;font-size:13.5px;color:var(--muted);line-height:1.6}
.genre-count{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700}
.aud-toggle{display:flex;gap:6px;padding:5px;margin:0 auto 16px;max-width:420px;border-radius:30px;background:#efe6dc}
.aud-toggle button{flex:1;position:relative;border:none;background:transparent;border-radius:24px;padding:10px 8px;font-size:15px;font-weight:700;color:#7d6a5c;cursor:pointer}
.aud-toggle button.on{background:#fff;color:var(--ink-deep);box-shadow:0 2px 8px rgba(15,48,37,.12)}
.aud-toggle button.on.kids{color:#c0641c}
.aud-toggle .dot{position:absolute;top:8px;right:14px;width:7px;height:7px;border-radius:50%;background:#d9a53a}
.aud-toggle.sm{margin:6px 0 0;max-width:260px}
.aud-toggle.sm button{padding:7px 8px;font-size:14px}
.aud-pick{margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:#faf6ef}
.aud-pick>span{font-size:13.5px;font-weight:700;color:var(--ink-deep)}
.aud-pick small{display:block;margin-top:6px;font-size:12.5px;color:#c0641c}
.g-kids{background:#fdebd8;color:#c0641c}
.kids .today-card{background:linear-gradient(180deg,#fff6ea,#fff 70%);border-color:#f3d3ae}
.kids .start-btn{background:linear-gradient(180deg,#e9963f,#c0641c)}
.flow.kids .q-text{font-size:17px}
.flow.kids textarea{font-size:17px}
.flow.kids .q-card{border-color:#f3dcc0}
.join-card{margin:28px auto;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center}
.join-card h2{font-size:22px;color:var(--ink-deep);margin-bottom:10px}
.join-card p{font-size:14.5px;line-height:1.75;color:var(--ink)}
.join-row{display:flex;gap:8px;margin-top:16px}
.join-row input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:17px;letter-spacing:.08em}
.join-super{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;text-align:left}
.join-super small{color:var(--muted);margin-left:6px}
.invite-box{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:6px 0 14px;padding:12px 16px;border-radius:12px;background:var(--accent-soft)}
.invite-box span{font-size:13px;font-weight:700;color:var(--accent)}
.invite-box b{font-size:22px;letter-spacing:.14em;color:var(--ink-deep)}
.invite-box small{flex-basis:100%;font-size:12.5px;color:var(--muted)}
/* 교회 고르기 · 사용 현황 (교회이음과 같은 틀) */
.center-box{min-height:calc(100vh - 120px);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 20px;width:100%;max-width:560px;box-shadow:0 6px 22px rgba(13,60,45,.06)}
.wrap .panel{max-width:none}
.panel.empty{text-align:center;color:var(--muted)}
.panel h2{font-size:17px;color:var(--ink-deep);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.logo-line{display:flex;align-items:center;gap:10px;font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:20px;font-weight:800;color:var(--ink-deep);margin-bottom:6px}
.small{font-size:13px}
.muted.small{color:var(--muted)}
.ch-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.ch-row b{font-size:15.5px}
.pick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button.sm{padding:7px 13px;font-size:13.5px;border-radius:9px}
button.primary.sm{width:auto}
.code-input{letter-spacing:4px!important;font-size:18px!important;font-weight:700;text-align:center}
.confirm-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px}
.own-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.own-top h2{border:none;margin:0;padding:0;flex:1;min-width:240px}
.own-top-act{display:flex;gap:8px}
.own-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:14px 0;border-bottom:1px solid var(--line)}
.own-main{flex:1 1 220px;min-width:0}
.own-name{font-size:16px;font-weight:700;color:var(--ink-deep);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.own-st{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:10px}
.st-live{background:#dff1e8;color:#0d6a46}.st-part{background:#fbefd6;color:#8a6212}.st-none{background:#eee;color:#777}
.own-nums{display:flex;flex-wrap:wrap;gap:6px 16px}
.own-nums div{display:flex;flex-direction:column;align-items:center;min-width:56px}
.own-nums b{font-size:16px;color:var(--ink-deep)}
.own-nums span{font-size:11.5px;color:var(--muted)}
.own-act{display:flex;gap:6px}
.landing .gate-user{position:absolute;top:16px;right:18px;z-index:2;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-radius:22px;
  background:rgba(255,255,255,.78);border:1px solid rgba(13,75,54,.18);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:13.5px;color:#123a2c}
.gate-user-ic svg{width:18px;height:18px;fill:#0d4b36;display:block}
.gate-user-name{font-weight:700}
.gate-user-bar{width:1px;height:14px;background:rgba(13,75,54,.3)}
.gate-user button{background:none;border:none;color:#0d4b36;font-size:13px;text-decoration:underline;padding:0 4px}
.landing-church{display:table;margin:16px auto 0;padding:7px 22px;border-radius:20px;background:rgba(255,255,255,.85);border:1px solid rgba(13,75,54,.18);
  font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:17px;font-weight:700;color:#102e24}
.dept-tabs{margin:18px 0 6px;max-width:none}
.dept-tabs b{margin-left:4px;font-size:13px;padding:1px 8px;border-radius:10px;background:rgba(0,0,0,.06)}
.who.kid{background:#fdebd8;color:#a8541a}
.yt-wrap{margin-top:4px}
.yt-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0b1814}
.yt-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-out{display:block;text-align:right;font-size:12.5px;color:var(--accent);margin-top:6px}
.yt-preview{margin-top:8px}
.today-video{margin:14px 0 4px;text-align:left}
.video-badge{display:inline-flex;align-items:center;gap:8px;margin:12px auto 0;padding:8px 14px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--ink-deep);font-size:13.5px;font-weight:700;cursor:pointer}
.video-badge small{font-weight:400;color:var(--muted);white-space:nowrap}
.video-badge span{white-space:nowrap}
.yt-ic{width:22px;height:16px;border-radius:5px;background:#e62117;position:relative;flex:none}
.yt-ic:after{content:"";position:absolute;left:8px;top:4px;border-left:7px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.upload-tabs{margin:10px 0 6px;max-width:360px}
.upload-tabs button{white-space:nowrap}
.rec-mode-bar{padding-bottom:0;flex:none}
.rec-mode{max-width:340px;margin:0}
.rec-mode button{white-space:nowrap}
.ref-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.ref-chip{font-size:12.5px;padding:4px 10px;border-radius:14px;background:#e3efe9;color:var(--ink-deep);font-weight:600;border:1px solid transparent;cursor:pointer}
.ref-chip.on{background:var(--ink-deep);color:#fff}
.ref-chip small{font-weight:400;opacity:.75}
.med-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}
@media (max-width:520px){.med-grid{grid-template-columns:repeat(3,1fr)!important}}
.my-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.my-book{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 0 10px;overflow:hidden}
.my-book-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;margin-bottom:8px}
.my-book-head b{font-size:15.5px;color:var(--ink-deep)}
.my-book-head span{font-size:12.5px;color:var(--ink-deep);opacity:.8}
.my-book-head .inv{color:#fff}
.my-book .ref-chips{padding:0 12px;margin:0 0 4px}
.my-book .detail{margin:0 12px}
.my-book .detail ul{list-style:none;padding:0;margin:0}
.imp-mode{margin:12px 0 4px;max-width:400px}
.imp-mode button{white-space:nowrap}
.admin-switch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.admin-switch span{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.admin-switch button.on{background:var(--ink-deep);color:#fff;border-color:var(--ink-deep)}
.fresh-box{margin:14px 0 4px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.fresh-box b{font-size:14.5px;color:var(--ink-deep)}
.who small{font-weight:400;color:var(--muted);margin-left:4px;font-size:11.5px}
.dash-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.dash-actions{display:flex;gap:8px;flex-wrap:wrap}
.dash-stats{margin-top:14px}
.admin-link{margin-top:6px;opacity:.85}
.who-list{display:flex;flex-wrap:wrap;gap:6px}
.who{display:inline-block;padding:5px 11px;border-radius:16px;background:#eef3f1;color:#4a5d56;font-size:13.5px}
.who.done{background:#e3efe9;color:var(--ink-deep);font-weight:700}
.who.me{outline:1.5px solid var(--accent)}
.member-table-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.member-table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.member-table th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#f7faf8}
.member-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.member-table th{white-space:nowrap}
.member-table tr:last-child td{border-bottom:none}
.member-table td small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.genre-chip{display:inline-block;font-family:'Noto Sans KR',sans-serif;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:14px;letter-spacing:0}
.genre-chip.sm{font-size:11px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.genre-chip.g-history{background:#e3f6f0;color:#0d4b36}
.genre-chip.g-wisdom{background:#e8efe6;color:#3f6a3a}
.genre-chip.g-prophecy{background:#e6e9f3;color:#3a4f86}
.q-card .q-num.ok{background:#3f8a55}
.q-card.q-last{border-color:#bbe3d6;background:linear-gradient(#fff,#f7fffc)}
.q-card .q-text{font-size:16px}

/* 교재 PDF 가져오기 */
.import-open{display:block;width:100%;margin:10px 0 4px;padding:12px;border-radius:12px;border:1.5px dashed var(--accent)!important;color:var(--accent)!important;background:#fffdf6!important;font-weight:700}
.import-panel .ai-like{margin-top:10px;font-size:13.5px;color:#7a5c1d;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.imp-summary{margin:14px 0 8px;display:flex;flex-direction:column;gap:2px}
.imp-summary b{font-family:'Noto Serif KR',serif;font-size:17px;color:var(--ink-deep)}
.imp-summary span{font-size:13px;color:var(--accent);font-weight:700}
.imp-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.imp-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.imp-item.off{opacity:.5}
.imp-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.imp-head input[type=date]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px}
.imp-check{display:inline-flex;align-items:center;gap:6px;min-width:110px}
.imp-check b{font-size:14px}
.imp-over{font-size:12px;color:#916218;display:inline-flex;align-items:center;gap:4px;background:#fdf1dc;border-radius:12px;padding:3px 8px}
.imp-peek{margin-top:6px;font-size:13px;color:#6f5c60;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:'Noto Serif KR',serif}
.imp-item details{margin-top:6px}
.imp-item summary{font-size:12.5px;color:var(--green);cursor:pointer}

/* 대문 */
.landing{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px 96px;background:#f8efe9;font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
.landing-scene{position:absolute;inset:0;background-size:cover;background-position:50% 50%;pointer-events:none}
.landing-inner{position:relative;z-index:1;text-align:center;color:var(--green)}
.landing-mark{display:inline-block;line-height:0;margin-bottom:22px;border-radius:27px;
  box-shadow:0 18px 36px rgba(9,58,42,.22),0 2px 6px rgba(9,58,42,.12)}
.landing-eyebrow{display:flex;align-items:center;justify-content:center;gap:18px;font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  font-size:15px;letter-spacing:.38em;color:#0d4b36;margin-bottom:12px;font-weight:500}
.landing-eyebrow span{text-indent:.38em}
.landing-eyebrow::before,.landing-eyebrow::after{content:"";height:1px;width:64px;background:rgba(13,75,54,.45)}
.landing-inner h1{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:78px;font-weight:800;color:#0d4b36;letter-spacing:-.01em;line-height:1.15;
  text-shadow:0 2px 16px rgba(255,255,255,.95)}
.landing-sub{margin-top:14px;color:#102e24;font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.005em;
  text-shadow:0 1px 8px rgba(255,255,255,.9)}
.landing-sub2{margin-top:14px;color:#3d5a50;font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:18px;font-weight:400;letter-spacing:.12em;text-indent:.12em;
  text-shadow:0 1px 8px rgba(255,255,255,.9)}
.enter-btn{margin-top:36px;display:inline-flex;align-items:center;justify-content:center;gap:40px;border:none;color:#fff;
  background:linear-gradient(#175943,#09412e);font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:21px;font-weight:700;letter-spacing:.02em;
  padding:16px 52px;border-radius:40px;box-shadow:0 14px 30px rgba(9,65,46,.32),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .15s,filter .15s}
.enter-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.landing-foot{position:absolute;left:0;right:0;bottom:20px;z-index:1;text-align:center;font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  font-size:12.5px;line-height:1.95;color:#154032;text-shadow:0 1px 4px rgba(255,255,255,.9)}
.foot-brand{display:flex;align-items:center;justify-content:center;gap:8px}
.foot-brand img{width:26px;height:26px;object-fit:contain;mix-blend-mode:multiply}
.landing-admin{margin-top:18px}
.landing-admin button{background:rgba(255,255,255,.75);border:1px solid rgba(13,75,54,.25);color:#0d4b36;border-radius:20px;padding:8px 18px;
  font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:14px;font-weight:600}
.landing-admin button:hover{background:#fff}
.head-links{display:flex;gap:14px;align-items:center}
.landing-ver{position:absolute;right:22px;bottom:24px;z-index:1;font-size:12.5px;color:#374842}

/* 계정 */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;width:100%;max-width:400px}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand svg{border-radius:15px}
.auth-brand h1{font-family:'Noto Serif KR',serif;font-size:24px;margin:8px 0 4px}
.auth-brand p{font-size:12.5px;color:var(--muted)}
.auth-tabs{display:flex;gap:6px;background:#ecf4f1;border-radius:10px;padding:4px;margin-bottom:6px}
.auth-tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-size:14px;color:var(--muted)}
.auth-tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-hint{font-size:13px;color:#7a5c1d;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-top:10px}
.auth-err{font-size:13px;color:var(--danger);background:#fbe9e6;border-radius:8px;padding:8px 12px;margin-top:14px}
.auth-submit{width:100%;margin-top:18px}
.auth-note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}

@media (max-width:640px){
  .tabs{display:grid;grid-template-columns:repeat(3,1fr)}
  .tabs .new-btn{grid-column:span 2}
  .word-text{font-size:16.5px}
  .tabs button{padding:8px 4px;font-size:12.5px}
  .tabs .home-btn{margin-left:0}
  .row{flex-direction:column;gap:0}
  .card-head{flex-direction:column;gap:6px}
  .card-meta{justify-content:flex-start}
  .bible-columns{grid-template-columns:1fr;gap:6px}
  .stat{min-width:calc(50% - 5px)}
  .landing-inner h1{font-size:46px}
  .landing-sub{font-size:15px;letter-spacing:.06em}
  .landing-sub2{font-size:13.5px;letter-spacing:.2em}
  .landing-eyebrow{font-size:11px;letter-spacing:.32em}
  .landing-eyebrow::before,.landing-eyebrow::after{width:34px}
  .landing-mark .mark-img{width:96px;height:96px}
  .enter-btn{font-size:17px;padding:14px 38px;gap:26px}
  .landing-foot{font-size:11px;bottom:30px}
  .landing-ver{right:0;left:0;bottom:10px;text-align:center;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
`;
