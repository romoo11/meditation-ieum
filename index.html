const today = () => new Date().toLocaleDateString("sv-SE"); /* YYYY-MM-DD (현지 시간) */
const shiftDate = (ymd, n) => {
  const [y, m, d] = ymd.split("-").map(Number);
  const t = new Date(y, m - 1, d + n);
  return t.toLocaleDateString("sv-SE");
};
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const prettyDate = (ymd) => {
  if (!ymd) return "";
  const [y, m, d] = ymd.split("-").map(Number);
  return `${y}년 ${m}월 ${d}일 (${DOW[new Date(y, m - 1, d).getDay()]})`;
};
const cleanText = (s) => String(s == null ? "" : s)
  .replace(/\u0000/g, "").replace(/[\u0001-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "");

function heat(count, max) {
  if (!count) return "var(--cell-empty)";
  const t = Math.min(1, count / Math.max(1, max));
  return `hsl(158, 48%, ${82 - t * 56}%)`;
}

/* 묵상 ↔ 서버 행 변환 */
function rowFrom(r, scope, authorName) {
  return {
    scope: scope || "personal",
    author_name: cleanText(authorName),
    date: cleanText(r.date),
    book: cleanText(r.book),
    ref: cleanText(r.ref),
    title: cleanText(r.title),
    verse: cleanText(r.verse),
    content: cleanText(r.content),
    apply: cleanText(r.apply),
    prayer: cleanText(r.prayer),
    tags: Array.isArray(r.tags) ? r.tags.map(cleanText).filter(Boolean) : [],
    word_id: r.wordId || null,
    ...(r.wordId ? {
      answers: Array.isArray(r.answers) ? r.answers.map(cleanText) : [],
      highlights: Array.isArray(r.highlights) ? r.highlights.filter((n) => Number.isFinite(n)) : [],
      done: !!r.done,
    } : {}),
  };
}
function recFrom(row, myId) {
  return {
    id: row.id,
    scope: row.scope || "personal",
    author: row.author_name || "",
    mine: row.user_id === myId,
    date: row.date || "",
    book: row.book || "",
    ref: row.ref || "",
    title: row.title || "",
    verse: row.verse || "",
    content: row.content || "",
    apply: row.apply || "",
    prayer: row.prayer || "",
    tags: Array.isArray(row.tags) ? row.tags : [],
    createdAt: row.created_at || "",
    wordId: row.word_id || null,
    answers: Array.isArray(row.answers) ? row.answers : [],
    highlights: Array.isArray(row.highlights) ? row.highlights : [],
    done: !!row.done,
  };
}

/* 성경 이름 → 갈래 (성경 지도의 갈래 이름을 그대로 따름) */
function genreOf(book) {
  for (const sec of BIBLE_SECTIONS) for (const g of sec.groups) {
    if (g.books.includes(book)) {
      if (g.name.startsWith("지혜서")) return "wisdom";
      if (g.name.startsWith("예언서")) return "prophecy";
      return "history";
    }
  }
  return "history";
}

/* 교재 질문: 말씀의 guide 안 '교재 묵상 질문' 묶음에 한 줄씩 저장 (따로 SQL 칸 없이) */
const QS_HEAD = /^(교재\s*묵상\s*질문|묵상\s*질문|오늘의\s*질문)\s*:?\s*/;
function bookQs(guide) {
  const out = [];
  String(guide || "").split(/\n\s*\n/).map((b) => b.trim()).filter((b) => QS_HEAD.test(b)).forEach((b) => {
    b.replace(QS_HEAD, "").split(/\n/).map((l) => l.replace(/^\s*(\d+[.)]|[①-⑳]|[-•·])\s*/, "").trim()).filter(Boolean).forEach((l) => out.push(l));
  });
  return out.slice(0, 6);
}
const qsLines = (t) => String(t || "").split(/\n/).map((l) => l.replace(/^\s*(\d+[.)]|[①-⑳]|[-•·])\s*/, "").trim()).filter(Boolean).slice(0, 6);
function composeGuide(step, qsText) {
  const qs = qsLines(qsText);
  const parts = [];
  if (filled(step)) parts.push(String(step).trim());
  if (qs.length) parts.push("교재 묵상 질문\n" + qs.map((q, i) => `${i + 1}. ${q}`).join("\n"));
  return parts.join("\n\n");
}

/* 유튜브 주소 → 영상 번호 (youtu.be / watch?v= / embed / shorts / live 모두) */
function ytId(url) {
  const u = String(url || "").trim();
  if (!u) return "";
  let m = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = u.match(/^[A-Za-z0-9_-]{11}$/);
  return m ? m[0] : "";
}
const ytStart = (url) => { const m = String(url || "").match(/[?&](?:t|start)=(\d+)/); return m ? Number(m[1]) : 0; };
function YouTubeBox({ url, title }) {

/* "6 드보라가 … 7 내가 …" → [{n:6, t:"드보라가 …"}, …] (절 번호가 1씩 늘어날 때만 나눔) */
function splitVerses(text) {
  const src = cleanVerse(text).replace(/\s+/g, " ").trim();
  if (!src) return [];
  const re = /(^|\s)(\d{1,3})\s(?=\S)/g;
  const cuts = [];
  let m, expect = null;
  while ((m = re.exec(src))) {
    const n = Number(m[2]);
    if (expect === null || n === expect) { cuts.push({ n, at: m.index + m[1].length, len: m[2].length + 1 }); expect = n + 1; }
  }
  if (!cuts.length) return [{ n: null, t: src }];
  const out = [];
  if (cuts[0].at > 0) out.push({ n: null, t: src.slice(0, cuts[0].at).trim() });
  cuts.forEach((c, i) => {
    const end = i + 1 < cuts.length ? cuts[i + 1].at : src.length;
    out.push({ n: c.n, t: src.slice(c.at + c.len, end).trim() });
  });
  return out.filter((v) => v.t);
}
/* "(개역개정)" 빼고, "[27] 그런즉" · "27. 그런즉" 같은 절 번호를 "27 그런즉"으로 맞춤 */
const cleanVerse = (t) => String(t || "").replace(/\s*\(개역\s*개정\)\s*/g, " ")
  .replace(/\[\s*(\d{1,3})\s*\]\s*/g, " $1 ").replace(/(^|\s)(\d{1,3})[.)]\s+(?=[가-힣"“'‘])/g, "$1$2 ")
  .replace(/\s+/g, " ").trim();
/* 예전에 올라간 말씀에 남은 "오늘의 본문 — … (로마서 3:27, 개역개정)" 머리말 걷어내기 */

  if (m) v = m[2].replace(/\s*[(\[][^()\[\]]*\d+\s*[:장편][^()\[\]]*[)\]]\s*$/, "").trim();
  return v;
};

/* 적용 도움: 질문 묶음(교재 묵상 질문·오늘의 질문)은 빼고 실천 안내만 남김 — 묵상 질문은 갈래별 6문항으로 하나만 보이게 */

function stepDone(rec, k) {
  if (!rec) return false;
  const a = rec.answers || [];
  if (k === "read") return true;
  if (k === "understand") return true;
  if (k === "meditate") return a.some(filled);
  if (k === "apply") return filled(rec.apply);
  if (k === "pray") return filled(rec.prayer);
  if (k === "note") return filled(rec.content) || !!rec.done;
  return false;
}

function monthCells(ym) {
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(`${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  while (cells.length % 7) cells.push(null);
  return cells;
}
const shiftMonth = (ym, n) => {
  const [y, m] = ym.split("-").map(Number);
  const t = new Date(y, m - 1 + n, 1);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}`;
};

/* ── 교재 PDF 읽기: pdf.js 글자 조각 → 문단 → 교재 구조 ── */
async function pdfToParas(pdfjs, buf) {
  const doc = await pdfjs.getDocument({ data: new Uint8Array(buf), disableFontFace: true, isEvalSupported: false }).promise;
  let meta = {};
  try { const m = await doc.getMetadata(); meta = (m && m.info) || {}; } catch (e) {}
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const pg = await doc.getPage(p);
    const tc = await pg.getTextContent();
    const its = tc.items.filter((i) => i.str && i.str.trim())
      .map((i) => ({ s: i.str, x: i.transform[4], y: i.transform[5], h: Math.abs(i.transform[0]) || i.height, w: i.width }))
      .sort((a, b) => (b.y - a.y) || (a.x - b.x));
    const lines = [];
    its.forEach((it) => {
      const L = lines.find((l) => Math.abs(l.y - it.y) < 2);
      if (L) { L.parts.push(it); }
      else lines.push({ y: it.y, parts: [it] });
    });
    lines.forEach((l) => {
      l.parts.sort((a, b) => a.x - b.x);
      l.x = l.parts[0].x;
      l.h = Math.max(...l.parts.map((q) => q.h));
      l.end = Math.max(...l.parts.map((q) => q.x + q.w));
      /* 조각 사이가 실제로 떨어져 있을 때만 띄어 씁니다 (글자마다 조각이 나뉘는 PDF 대비) */
      l.text = l.parts.reduce((acc, q, qi) => {
        if (!qi) return q.s;
        const a = l.parts[qi - 1];
        const gap = q.x - (a.x + (a.w || 0));
        const sp = /\s$/.test(acc) || /^\s/.test(q.s) || !a.w || gap > Math.max(a.h, q.h) * 0.18;
        return acc + (sp ? " " : "") + q.s;
      }, "").replace(/\s+/g, " ").trim();
    });
    lines.sort((a, b) => b.y - a.y);
    pages.push(lines.filter((l) => !/^\d{1,3}$/.test(l.text)));   /* 쪽 번호 빼기 */
  }
  /* 줄 안쪽 낱말 모음 (줄 끝 조각을 붙일지 띄울지 판단하는 데 씁니다) */
  const all = pages.flat();
  const inner = all.map((l) => l.text.split(" ").slice(1, -1).join(" ")).join(" ");
  const strip = (w) => w.replace(/^[\s"'“”‘’(]+|[\s"'“”‘’).,?!:;]+$/g, "");
  const vocab = new Set(inner.split(" ").map(strip).filter(Boolean));
  const ENDS = /(를|을|은|는|에게|고|며|만|요|서)$/;
  const joinLines = (A, B) => {
    const a = A.split(" ").pop(), b = B.split(" ")[0];
    const han = /[가-힣]/;
    if (!han.test(a.slice(-1)) || !han.test(b[0])) return A + " " + B;
    const ab = strip(a) + strip(b);
    if (ab.length >= 2 && inner.includes(ab)) return A + B;
    if (strip(b).length === 1 && /[.,?!]/.test(b)) return A + B;   /* "갑니|다." "는데|도," */
    if (vocab.has(strip(b))) return A + " " + B;
    if (strip(a).length >= 2 && ENDS.test(strip(a)) && strip(b).length >= 2) return A + " " + B;
    return A + B;
  };
  const paras = [];
  let cur = null, prev = null;
  const flush = () => { if (cur) paras.push(cur); cur = null; };
  pages.forEach((lines, pi) => {
    lines.forEach((l, li) => {
      const newPage = li === 0 && pi > 0;
      const gap = prev && !newPage ? prev.y - l.y : 0;
      const listCont = cur && /^(\d{1,2}\.|•)\s/.test(cur.text) && l.x > cur.x;
      const breakPara = !cur || Math.abs(l.h - cur.h) > 0.6
        || (!newPage && gap > (prev.h || 10) * 2.05)
        || (Math.abs(l.x - cur.x) > 12 && !listCont && !(newPage && Math.abs(l.x - cur.lastX) < 12));
      if (breakPara) { flush(); cur = { text: l.text, h: l.h, x: l.x, lastX: l.x }; }
      else { cur.text = joinLines(cur.text, l.text); cur.lastX = l.x; }
      prev = l;
    });
  });
  flush();
  return { paras: paras.map((p) => p.text.trim()).filter(Boolean), meta };
}

/* 본문 속 절 번호로 장·절 만들기: 장 4 + "6 … 9 …" → "4:6-9" */
function refFromText(text, chap) {
  const ns = splitVerses(text).map((v) => v.n).filter((n) => n !== null);
  if (!ns.length) return chap ? `${chap}장` : "";
  const a = ns[0], b = ns[ns.length - 1];
  return (chap ? chap + ":" : "") + a + (b > a ? "-" + b : "");
}
function loadPdfJs() {
  return new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error("PDF 읽기 도구를 불러오지 못했습니다 (인터넷 연결 확인)"));
    document.head.appendChild(s);
  });
}

const BOOK_KEYS = [...BOOK_NAMES, ...Object.keys(BOOK_ABBR)].filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => b.length - a.length);
/* 사사기 4:6-9 / 삿 4:6~9 / 시편 23편 / 사사기 4장 6-9절 / 요한복음 3장 */
const REF_RE = new RegExp("(^|[^가-힣])(" + BOOK_KEYS.join("|") + ")\\s*(\\d{1,3})\\s*(?:(?::|장\\s*|편\\s*)(\\d{1,3})?(?:\\s*절)?(?:\\s*[-~–]\\s*(\\d{1,3})(?::(\\d{1,3}))?(?:\\s*절)?)?)");
function findRef(text) {
  const m = String(text || "").match(REF_RE);
  if (!m) return null;
  const key = m[2];
  const book = BOOK_NAMES.includes(key) ? key : BOOK_ABBR[key];
  /* 약어는 장:절 꼴일 때만 믿습니다 ("요 3:16"은 되고 "아 2개"는 안 되게) */
  const whole = m[0].slice(m[1].length);
  if (!BOOK_NAMES.includes(key) && !/[:장편]/.test(whole)) return null;
  const chap = m[3];
  let ref = "";
  if (m[4]) ref = `${chap}:${m[4]}` + (m[5] ? (m[6] ? `-${m[5]}:${m[6]}` : `-${m[5]}`) : "");
  else ref = `${chap}장` + (m[5] ? `-${m[5]}장` : "");
  return { book, chap, ref, at: m.index + m[1].length, text: whole.trim() };
}

/* 마크다운·꾸밈 기호 걷어내기 */
const normPara = (t) => String(t || "")
  .replace(/\[\[\/?note\]\]|\[\[lines:\d+\]\]|\[\[draw(:\d+)?\]\]|\[\[pagebreak\]\]/g, " ")
  .replace(/^\s*#{1,6}\s*/, "").replace(/^\s*>\s?/, "")
  .replace(/\*\*|__/g, "").replace(/^\s*[-*+]\s+/, "• ")
  .replace(/^\s*-{3,}\s*$/, "").replace(/\s+/g, " ").trim();

/* 글(txt/md/docx에서 뽑은 글) → 문단 */
function textToParas(text) {
  const out = [];
  String(text || "").replace(/\r/g, "")
    .replace(/\[\[note\]\][\s\S]*?\[\[\/note\]\]/g, "\n\n")
    .replace(/^---\s*\n([\s\S]*?)\n---\s*\n/, (all, fm) => fm.split("\n").map((l) => l.replace(/^[^:]{1,12}:\s*/, "").replace(/^["']|["']$/g, "")).join("\n\n") + "\n\n").split(/\n\s*\n/).forEach((block) => {
    let buf = "";
    block.split("\n").forEach((raw) => {
      const l = raw.trim();
      if (!l) return;
      const n = normPara(l);
      const alone = /^(#{1,6}\s|[-*+•]\s|\d{1,2}[.)]\s|[①-⑳]|Q\d|\*\*)/.test(l) || !!classifyPara(n) || !!onlyRef(n);
      /* 줄바꿈이 문단 나눔인지, 긴 문장이 접힌 것인지: 앞 줄이 문장 끝이거나 짧으면 새 문단 */
      const prevEnded = !buf || /[.?!。…"”'’)\]]$/.test(buf) || /(다|요|까|라|오|서|소서|멘|니다)$/.test(buf) || buf.length < 25;
      const newKind = isVerseLike(n) || /^>/.test(l) !== /^>/.test(buf || "")
        || (!!buf && isVerseLike(normPara(buf)) && /((니다|어요|에요|세요|군요|네요)[.!]?|[?？])\s*$/.test(n));   /* 성경 구절 뒤의 해설 문장 */
      if (alone) { if (buf) out.push(buf); buf = ""; out.push(l); }
      else if (buf && !prevEnded && !newKind) buf += " " + l.replace(/^>\s?/, "");
      else { if (buf) out.push(buf); buf = l; }
    });
    if (buf) out.push(buf);
  });
  return out.map(normPara).filter(Boolean);
}

/* Word·한글: 압축 파일 안 XML 문단 → 글 */
function loadScript(src, globalName) {
  return new Promise((resolve, reject) => {
    if (window[globalName]) return resolve(window[globalName]);
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => (window[globalName] ? resolve(window[globalName]) : reject(new Error("도구를 불러오지 못했습니다")));
    s.onerror = () => reject(new Error("파일 읽기 도구를 불러오지 못했습니다 (인터넷 연결 확인)"));
    document.head.appendChild(s);
  });
}
const loadJsZip = () => loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js", "JSZip");
function xmlParas(xml, pTag, tTag) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const ps = doc.getElementsByTagName(pTag);
  const out = [];
  for (const p of Array.from(ps)) {
    let up = p.parentNode, nested = false;
    while (up && up.nodeType === 1) { if (up.nodeName === pTag) { nested = true; break; } up = up.parentNode; }
    if (nested) continue;   /* 문단 안 문단(글상자) 중복 막기 */
    let t = "";
    const walk = (n) => {
      for (const c of Array.from(n.childNodes)) {
        if (c.nodeType !== 1) continue;
        if (c.nodeName === tTag) t += c.textContent;
        else if (/(:|^)(tab)$/.test(c.nodeName)) t += " ";
        else if (/(:|^)(br|lineBreak)$/.test(c.nodeName)) t += "\n";
        else if (c.nodeName !== pTag) walk(c);
      }
    };
    walk(p);
    /* Word 자동 번호 목록은 번호 글자가 없으므로 '• '를 붙여 한 항목으로 둡니다 */
    if (pTag === "w:p" && p.getElementsByTagName("w:numPr").length && t.trim()) t = "• " + t.trim();
    out.push(t);
  }
  return out;
}
async function docxToText(buf) {
  const JSZip = await loadJsZip();
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file("word/document.xml");
  if (!f) throw new Error("Word 파일 안에서 본문을 찾지 못했습니다");
  return xmlParas(await f.async("string"), "w:p", "w:t").join("\n\n");
}
async function hwpxToText(buf) {
  const JSZip = await loadJsZip();
  const zip = await JSZip.loadAsync(buf);
  const names = Object.keys(zip.files).filter((n) => /^Contents\/section\d+\.xml$/i.test(n))
    .sort((a, b) => Number(a.match(/\d+/)[0]) - Number(b.match(/\d+/)[0]));
  if (!names.length) throw new Error("한글 파일 안에서 본문을 찾지 못했습니다");
  const parts = [];
  for (const n of names) parts.push(xmlParas(await zip.file(n).async("string"), "hp:p", "hp:t").join("\n\n"));
  return parts.join("\n\n");
}

/* 머리말 뒤 같은 줄에 내용이 와도 되는 낱말 (나머지는 '말씀:'처럼 쌍점이 있을 때만) */
const INLINE_OK = /^(오늘의질문|한줄기도|오늘생각|쉽게말하면|한문장으로|이번주암송|이번주실천|오늘한가지|오늘의한걸음|기도제목|오늘의적용|기도|제목|본문|말씀)$/;
const DAY_NAMES = { 월: 0, 화: 1, 수: 2, 목: 3, 금: 4, 토: 5, 일: 6, 주: 6 };
const ORD = { 첫: 1, 둘: 2, 셋: 3, 넷: 4, 다섯: 5, 여섯: 6, 일곱: 7, 여덟: 8, 아홉: 9, 열: 10 };
const SEP = /^[\s—–\-:·|.,)\]]+/;

/* 날짜 머리말: "10월 14일 (수)", "2026.10.14", "10/14 수", "14일(수)", "수요일 (10/14)", "Day 3", "셋째 날" … */
const DOWC = "([월화수목금토일])(?:요일)?";
function parseDayHead(s0) {
  const s = s0.replace(/^[\s\[\(<〈《【「『○●◎◆◇■□▶▷►☆★✔✓※•·\-–—]+/, "");
  const dowOpt = "(?:\\s*[\\(\\[]?\\s*" + DOWC + "\\s*[\\)\\]]?)?";
  const dowReq = "\\s*[\\(\\[]?\\s*" + DOWC + "\\s*[\\)\\]]?";
  const tidy = (r) => r.replace(/^\s*[\]\)】>」』〉》]+/, "");
  const dowOf = (c) => (c ? DAY_NAMES[c] : undefined);
  let m;
  if ((m = s.match(new RegExp("^(?:(\\d{4})\\s*년\\s*)?(\\d{1,2})\\s*월\\s*(\\d{1,2})\\s*일" + dowOpt))))
    return { info: { y: m[1] ? +m[1] : null, mo: +m[2], d: +m[3], wd: dowOf(m[4]) }, rest: tidy(s.slice(m[0].length)) };
  if ((m = s.match(new RegExp("^(\\d{4})\\s*[.\\-/]\\s*(\\d{1,2})\\s*[.\\-/]\\s*(\\d{1,2})\\.?" + dowOpt))))
    return { info: { y: +m[1], mo: +m[2], d: +m[3], wd: dowOf(m[4]) }, rest: tidy(s.slice(m[0].length)) };
  if ((m = s.match(new RegExp("^(\\d{1,2})\\s*[./]\\s*(\\d{1,2})\\.?" + dowReq))) && +m[1] <= 12 && +m[2] <= 31)
    return { info: { mo: +m[1], d: +m[2], wd: dowOf(m[3]) }, rest: tidy(s.slice(m[0].length)) };
  if ((m = s.match(/^(\d{1,2})\s*[./]\s*(\d{1,2})\.?\s*[\]\)】]?\s*$/)) && +m[1] <= 12 && +m[2] <= 31)
    return { info: { mo: +m[1], d: +m[2] }, rest: "" };
  if ((m = s.match(new RegExp("^(\\d{1,2})\\s*일" + dowReq))) && +m[1] <= 31)
    return { info: { dom: +m[1], dow: dowOf(m[2]) }, rest: tidy(s.slice(m[0].length)) };
  if ((m = s.match(/^(월|화|수|목|금|토|일)요일/)) || (m = s.match(/^(주)일(?![가-힣])/))) {
    let rest = s.slice(m[0].length);
    const info = { dow: DAY_NAMES[m[1]] };
    const dm = rest.match(/^\s*[\(\[]?\s*(?:(\d{4})\s*[.\-/년]\s*)?(\d{1,2})\s*[./월]\s*(\d{1,2})\s*일?\.?\s*[\)\]]?/);
    if (dm && +dm[2] <= 12) { info.mo = +dm[2]; info.d = +dm[3]; info.y = dm[1] ? +dm[1] : null; rest = rest.slice(dm[0].length); }
    return { info, rest: tidy(rest) };
  }
  if ((m = s.match(/^(?:day|DAY|Day)\s*(\d{1,2})(?!\d)/)) || (m = s.match(/^제?\s*(\d{1,2})\s*일\s*(?:차|째)/)) || (m = s.match(/^(\d{1,2})\s*일(?=\s*[—–\-:·|]|$)/)))
    return { info: { n: +m[1] }, rest: s.slice(m[0].length) };
  if ((m = s.match(/^(첫|둘|셋|넷|다섯|여섯|일곱|여덟|아홉|열)\s*째\s*날/)))
    return { info: { n: ORD[m[1]] }, rest: s.slice(m[0].length) };
  return null;
}

function classifyPara(p) {
  if (!p) return null;
  const s = p.replace(/\s*\(\s*\d+\s*분\s*\)\s*$/, "").trim();   /* "(10분)" 빼기 */
  const k = s.replace(/\s+/g, "");
  const short = s.length <= 60;
  /* 큰 묶음 */
  if (short) {
    if (/^(개인묵상|개인큐티|큐티|QT)(\(QT\))?$/i.test(k) || /^개인묵상\(?QT\)?$/i.test(k)) return { unit: "qt" };
    if (/^(소그룹|구역|목장|셀|순|다락방|속회)(나눔|모임|예배|교재)?$/.test(k) && k.length >= 3) return { unit: "group" };
    if (/^가정예배/.test(k) && s.length <= 30) return { unit: "family" };
    if (/^(이번주말씀묵상|주보묵상|주보)$/.test(k)) return { unit: "essay" };
    if (/^(주중\d?일?묵상|한주묵상|\d일묵상|매일묵상|주중묵상|주중\d일로늘릴때|어린이묵상(집)?)$/.test(k)) return { container: true };
  }
  /* 요일·날짜·Day N 머리말 */
  if (short) {
    const h = parseDayHead(s);
    if (h) {
      const { info, rest } = h;
      if (!rest.trim() || SEP.test(rest) || /^\s/.test(rest)) {
        const title = rest.replace(SEP, "").replace(/\s*[—–\-:·|]+\s*$/, "").trim();
        /* 머리말 뒤가 긴 문장이면 머리말이 아님 */
        const sentence = title.length > 15 && /(다|요|죠|까)[.!?]?$/.test(title);
        if (title.length <= 40 && !sentence) {
          const isWord = FIELD_WORDS.some(([, ws]) => ws.includes(title.replace(/\s+/g, "")));
          return { unit: "day", ...info, title: isWord ? "" : title };
        }
      }
    }
  }
  /* 칸 머리말 */
  for (const [field, words] of FIELD_WORDS) {
    for (const w of words) {
      if (!k.startsWith(w)) continue;
      const after = k.slice(w.length);
      if (!after || /^[:：]$/.test(after) || /^\(.*\)$/.test(after)) return { field };
      /* 같은 줄에 내용 */
      const idx = (() => { let n = 0, i = 0; while (i < s.length && n < w.length) { if (!/\s/.test(s[i])) n++; i++; } return i; })();
      const restRaw = s.slice(idx);
      if (/^\s*[:：—–\-]/.test(restRaw)) return { field, rest: restRaw.replace(/^\s*[:：—–\-]+\s*/, "").trim(), dashed: true };
      if (INLINE_OK.test(w) && /^\s+\S/.test(restRaw)) {
        if ((w === "본문" || w === "말씀") && !findRef(restRaw.slice(0, 30))) continue;
        if (w === "기도" && restRaw.trim().length < 2) continue;
        return { field, rest: restRaw.trim() };
      }
    }
  }
  return null;
}

/* 문단 모양 */
const isVerseLike = (p) => /^(\[\s*\d{1,3}\s*\]|\d{1,3}[.)]?)\s*[가-힣"“'‘]/.test(p) || /\(?\s*개역\s*개정\s*\)?/.test(p)
  || (/^["“]/.test(p) && !!findRef(p.slice(-30)));
const onlyRef = (p) => {
  const r = findRef(p);
  if (!r) return null;
  const rest = p.replace(r.text, "").replace(/개역\s*개정|새번역|쉬운성경|NIV|ESV/g, "").replace(/[\s()\[\]{}<>.,:;·\-–—~|"“”'‘’]/g, "");
  return rest.length === 0 ? r : null;
};
const isQuestion = (p) => /[?？]\s*$/.test(p) || /[?？]\s*["”']?\s*$/.test(p);

function splitQuestions(list) {
  const out = [];
  const marked = (t) => /(^|\s)(\d{1,2}[.)]|[①-⑳]|Q\s*\d{1,2}|•)\s*\S/.test(t);
  list.flatMap((t) => marked(t) ? [t] : t.replace(/([?？])\s+(?=\S)/g, "$1\n").split("\n")).forEach((t) => {
    const parts = t.replace(/Q\s+(\d)/g, "Q$1").split(/(?:^|\s)(?=(?:\d{1,2}[.)]|[①-⑳]|Q\d{1,2}[.:)]?|•)\s*)/).map((x) => x.trim()).filter(Boolean);
    parts.forEach((x) => {
      const isItem = /^(\d{1,2}[.)]|[①-⑳]|Q\d{1,2}[.:)]?|•)/.test(x);
      const c = x.replace(/^(\d{1,2}[.)]|[①-⑳]|Q\d{1,2}[.:)]?|•)\s*/, "").trim();
      if (!c) return;
      if (isItem || !out.length || isQuestion(out[out.length - 1])) out.push(c);
      else out[out.length - 1] += " " + c;
    });
  });
  return out.filter((q) => q.length > 1);
}

function newUnit(c) {
  return { type: c.unit, dow: c.dow, wd: c.wd, n: c.n, y: c.y, mo: c.mo, d: c.d, dom: c.dom, title: c.title || "", head: c.title || "",
    verse: [], bg: [], look: [], qs: [], step: [], prayer: [], keyv: [], refs: [], field: null };
}
function unitHasBody(u) { return u.verse.length || u.look.length || u.qs.length || u.bg.length || u.step.length || u.prayer.length; }

function parseAnyDevotional(rawParas, meta) {
  const paras = rawParas.map(normPara).filter(Boolean);
  const cover = [];
  const units = [];
  let cur = null, ctxGroup = null;
  const add = (u, field, t) => {
    if (!t) return;
    if (field === "title") { u.title = u.title || t; return; }
    if (field === "skip") return;
    if (field === "verse") {
      const r = onlyRef(t);
      if (r) { u.refs.push(r); return; }
      if (u.verse.length && !isVerseLike(t) && t.length > 40) { u.look.push(t); return; }
      if (!isVerseLike(t) && /(읽습니다|읽어요|읽으세요|읽게|읽겠습니다|봉독|소리\s*내어)/.test(t) && t.length < 120) { u.bg.push(t); return; }
      const lead = !u.verse.length && t.match(/^([^\d]{4,120}?[.!?])\s+(\d{1,3}\s+[가-힣"“].*)$/);
      if (lead) { u.bg.push(lead[1]); t = lead[2]; }
      const r2 = findRef(t); if (r2) u.refs.push(r2);
      u.verse.push(t); return;
    }
    if (field === "keyv") { const r = onlyRef(t); if (!r) u.keyv.push(t); return; }
    if (field) { u[field].push(t); return; }
    /* 머리말 없이 온 문단은 모양으로 짐작 */
    const r = onlyRef(t);
    if (r) { u.refs.push(r); return; }
    if (!u.verse.length && isVerseLike(t)) { u.verse.push(t); const r2 = findRef(t); if (r2) u.refs.push(r2); return; }
    if (isQuestion(t) || /^(\d{1,2}[.)]|Q\s*\d)\s*\S.*[?？]/.test(t)) { u.qs.push(t); return; }
    if (/^(주님|하나님|아버지|주여|예수님|사랑의|거룩하신|은혜로우신|자비로우신|살아계신|좋으신)[^.?!]{0,25}[,，]/.test(t) || /아멘\.?\s*$/.test(t)) { u.prayer.push(t); return; }
    u.look.push(t);
  };
  for (const p of paras) {
    /* "본문 마태복음 6:25 | 제목 염려하지 말라" 처럼 한 줄에 여러 칸 */
    const segs = p.includes("|") ? p.split(/\s*\|\s*/).filter(Boolean) : [p];
    for (const t of segs) {
      const c = classifyPara(t);
      if (c && c.container) { ctxGroup = "days"; continue; }
      if (c && c.unit) {
        cur = newUnit(c);
        if (c.unit === "day" && c.title) { const r = findRef(c.title); if (r) cur.refs.push(r); }
        units.push(cur);
        continue;
      }
      if (c && c.field) {
        if (!cur) {
          /* 머리말 없는 첫 칸: 한 편짜리 교재 */
          cur = newUnit({ unit: "single" }); units.push(cur);
        }
        cur.field = c.field;
        if (c.rest && c.field === "verse" && !(isVerseLike(c.rest) && !/개역\s*개정/.test(c.rest) && c.rest.length > 40)) {
          /* "오늘의 본문 — 오직 믿음의 법으로니라 (로마서 3:27)": 머리말 줄의 말은 핵심 구절로, 본문 칸은 열어 둠 */
          const r = findRef(c.rest); if (r) cur.refs.push(r);
          const q = c.rest.replace(/\s*[(\[][^()\[\]]*\d+\s*[:장편][^()\[\]]*[)\]]\s*$/, "").replace(/\(?\s*개역\s*개정\s*\)?/g, "").trim();
          if (q && !onlyRef(c.rest)) cur.headVerse = q;
        } else if (c.rest) add(cur, c.field, c.rest);
        continue;
      }
      if (!cur) { cover.push(t); continue; }
      /* 문단이 질문 칸에 들어왔는데 질문도 번호도 아니고 긴 글이면 해설로 */
      if (cur.field === "qs" && !isQuestion(t) && !/^(\d{1,2}[.)]|[①-⑳]|Q\d|•)/.test(t) && t.length > 80) { add(cur, null, t); continue; }
      add(cur, cur.field, t);
    }
  }
  /* 머리말이 하나도 없으면 문서 전체를 한 편으로 */
  if (!units.length) {
    const u = newUnit({ unit: "single" });
    const body = cover.splice(0);
    const first = body[0] && !isVerseLike(body[0]) && body[0].length <= 40 ? body.shift() : "";
    if (first) { cover.push(first); const r = findRef(first); if (r) u.refs.push(r); }
    body.forEach((t) => add(u, null, t));
    units.push(u);
  }
  /* 제목·본문 범위 */
  let passage = null;
  for (const t of cover) { const r = findRef(t); if (r) { passage = r; break; } }
  if (!passage) for (const u of units) { if (u.refs[0]) { passage = u.refs[0]; break; } }
  if (!passage) {   /* 해설 글 속 "사사기 4장" 같은 말 (약어는 빼고 성경 이름만) */
    for (const t of paras) { const r = findRef(t); if (r && BOOK_NAMES.includes(r.text.match(/^[가-힣]+/)[0])) { passage = r; break; } }
  }
  const metaTitle = String((meta && meta.Title) || "").replace(/^Microsoft Word\s*-\s*/i, "").replace(/\.(docx?|hwpx?|pdf|txt|md)$/i, "").trim();
  const coverTitle = cover.find((t) => t.length <= 40 && !onlyRef(t) && !/devotional|guide|minister|말씀\s*묵상\s*자료|^\d{4}\s*년|설교자|목사$/i.test(t) && !/^[\d\s.\-/년월일()]+$/.test(t) && !classifyPara(t));
  const title = (metaTitle && !/^(untitled|제목\s*없음|말씀\s*묵상\s*자료)$/i.test(metaTitle) ? metaTitle : "") || coverTitle || "";
  return { units: units.filter(unitHasBody), title, passage, cover, ctxGroup };
}

/* 하루치 묶음 → 오늘의 말씀 항목 (monday = 기준 주 월요일) */
function unitsToEntries(parsed, monday) {
  const { units, title: docTitle, passage } = parsed;
  const essay = units.find((u) => u.type === "essay");
  const list = units.length > 1 ? units.filter((u) => u.type !== "essay") : units;
  const used = new Set();
  const [my] = monday.split("-").map(Number);
  const offOfDate = (u) => {
    let y = u.y || my;
    const md = new Date(my, +monday.split("-")[1] - 1, +monday.split("-")[2]);
    let t = new Date(y, u.mo - 1, u.d);
    if (!u.y) {   /* 해가 없으면 기준일에 가장 가까운 해로 */
      const alt = [new Date(y - 1, u.mo - 1, u.d), new Date(y + 1, u.mo - 1, u.d)];
      alt.forEach((a) => { if (Math.abs(a - md) < Math.abs(t - md)) t = a; });
    }
    return Math.round((t - md) / 86400000);
  };
  const sawWeekday = { v: false };
  const out = [];
  const hasDays = list.some((u) => u.type === "day");
  /* 1) 요일·날짜가 정해진 날 먼저 */
  const md0 = new Date(my, +monday.split("-")[1] - 1, +monday.split("-")[2]);
  let last = null;   /* 앞서 나온 날짜 (달이 빠진 "14일(수)"에 씀) */
  const fixed = list.map((u) => {
    if (u.type !== "day") return null;
    let off = null;
    if (u.dom && !u.mo) {
      let cands = [];
      if (last) {
        const t = new Date(last.getFullYear(), last.getMonth() + (u.dom < last.getDate() ? 1 : 0), u.dom);
        cands = [t];
      } else {
        for (const k of [-1, 0, 1]) cands.push(new Date(md0.getFullYear(), md0.getMonth() + k, u.dom));
        if (u.dow !== undefined) { const ok = cands.filter((t) => (t.getDay() + 6) % 7 === u.dow); if (ok.length) cands = ok; }
        cands.sort((a, b) => Math.abs(a - md0) - Math.abs(b - md0));
      }
      const t = cands[0];
      u.y = t.getFullYear(); u.mo = t.getMonth() + 1; u.d = t.getDate();
    }
    if (u.mo) { off = offOfDate(u); last = new Date(md0.getTime() + off * 86400000); u.fixedDate = true; }
    else if (u.n) off = u.n - 1;
    else if (u.dow !== undefined) { if (u.dow === 6) off = sawWeekday.v ? 6 : -1; else { off = u.dow; sawWeekday.v = true; } }
    if (off !== null) used.add(off);
    return off;
  });
  list.forEach((u, idx) => {
    let off = fixed[idx], label = "";
    if (u.type === "day") {
      if (u.mo) label = `${u.mo}월 ${u.d}일` + (u.dow !== undefined || u.wd !== undefined ? ` (${["월", "화", "수", "목", "금", "토", "일"][u.wd !== undefined ? u.wd : u.dow]})` : "");
      else if (u.n) label = `${u.n}일째`;
      else if (u.dow !== undefined) label = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "주일"][u.dow];
    }
    if (u.type === "qt") label = "개인 묵상(QT)";
    if (u.type === "group") label = "소그룹 나눔";
    if (u.type === "family") label = "가정예배";
    if (u.type === "essay") label = "주보 묵상";
    if (u.type === "single") label = "교재 묵상";
    if (off === null) {
      const prefer = u.type === "single" && !hasDays ? [0, 1, 2, 3, 4, 5, 6, -1] : [-1, 6, 5, 0, 1, 2, 3, 4];
      off = prefer.find((o) => !used.has(o));
      if (off === undefined) { off = 7; while (used.has(off)) off++; }
    }
    used.add(off);
    const ref0 = u.refs[0] || passage;
    const book = ref0 ? ref0.book : "";
    const chap = ref0 ? ref0.chap : "";
    const verse = u.verse.join(" ");
    let ref = "";
    const fromNums = splitVerses(verse).some((v) => v.n !== null) ? refFromText(verse, chap) : "";
    const headRef = u.refs[0] && /:/.test(u.refs[0].ref) ? u.refs[0].ref : "";
    /* 절 번호가 머리말 장절보다 넓으면 절 번호를 따름 (머리말 3:27, 본문 27~28절 → 3:27-28) */
    if (fromNums && (!headRef || (/-/.test(fromNums) && !/-/.test(headRef)))) ref = fromNums;
    else ref = headRef || fromNums || (u.refs[0] ? u.refs[0].ref : "");
    const qs = splitQuestions(u.qs).slice(0, 6);
    const bullets = u.prayer.some((t) => /^•/.test(t));
    const background = [...u.bg, ...(essay && (u.type === "qt" || list.length === 1) && essay !== u ? [parasOf(essay.look.join("\n\n"))[0] || ""] : [])].filter(Boolean).join("\n\n");
    out.push({
      fixedDate: !!u.fixedDate,
      key: u.type + "-" + idx, label: label + (u.type === "day" && u.head && !/^\d/.test(u.head) ? " — " + u.head : ""),
      on: u.type !== "family", off, date: shiftDate(monday, off),
      title: u.title || docTitle, book, ref,
      verse: cleanVerse(verse || u.headVerse || ""),
      background,
      commentary: u.look.join("\n\n"),
      key_verse: cleanVerse(u.keyv.join(" ")) || (verse && u.headVerse ? cleanVerse(u.headVerse) : "") || (u.type === "day" ? cleanVerse(verse) : ""),
      guide: u.step.join(" "),
      qs: qs.join("\n"),
      prayer: bullets ? u.prayer.map((t) => t.replace(/^•\s*/, "• ")).join("\n") : u.prayer.join(" "),
    });
  });
  return {
    entries: out.sort((a, b) => a.off - b.off),
    title: docTitle,
    passage: passage ? `${passage.book} ${passage.ref}` : "",
  };
}

/* 파일 하나 → 문단 */
async function fileToParas(file) {
  const name = (file.name || "").toLowerCase();
  const buf = await file.arrayBuffer();
  if (/\.pdf$/.test(name) || file.type === "application/pdf") {
    const pdfjs = await loadPdfJs();
    return pdfToParas(pdfjs, buf);
  }
  if (/\.docx$/.test(name)) return { paras: textToParas(await docxToText(buf)), meta: {} };
  if (/\.hwpx$/.test(name)) return { paras: textToParas(await hwpxToText(buf)), meta: {} };
  if (/\.(hwp|doc)$/.test(name)) throw new Error(/\.hwp$/.test(name)
    ? "예전 한글(.hwp) 파일은 바로 읽을 수 없습니다. 한글에서 'PDF로 저장'하거나 '다른 이름으로 저장 → .hwpx'로 바꿔 올려 주세요. 글을 복사해 아래 '글 붙여넣기'에 넣어도 됩니다."
    : "예전 Word(.doc) 파일은 읽을 수 없습니다. Word에서 .docx나 PDF로 저장해 올려 주세요.");
  if (/\.(txt|md|markdown)$/.test(name) || /^text\//.test(file.type)) {
    let t = new TextDecoder("utf-8").decode(buf);
    if (t.includes("�")) { try { t = new TextDecoder("euc-kr").decode(buf); } catch (e) {} }
    return { paras: textToParas(t), meta: {} };
  }
  throw new Error("이 파일 형식은 읽을 수 없습니다. PDF, Word(.docx), 한글(.hwpx), 글(.txt) 파일을 올려 주세요.");
}

/* ── 로그인 / 가입 / 비밀번호 재설정 ── */
function LoginScreen() {
  const [mode, setMode] = useState(() => { try { if (sessionStorage.getItem("med-admin-login") === "1") { sessionStorage.removeItem("med-admin-login"); return "admin"; } } catch (e) {} return "login"; });
  const [email, setEmail] = useState("");
  const [name, setName] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);
  const reset = (m) => { setMode(m); setErr(""); setInfo(""); };

  const doLogin = async () => {
    setErr(""); setBusy(true);
    if (mode === "admin") {
      if (email.trim().toLowerCase() !== ADMIN_EMAIL.toLowerCase()) { setBusy(false); return setErr("전체 관리자 계정이 아닙니다. 교회 관리자는 일반 '로그인'으로 들어간 뒤 메뉴의 '관리자 화면'을 이용해 주세요."); }
      try { sessionStorage.setItem("med-admin", "1"); } catch (e) {}
    } else { try { sessionStorage.removeItem("med-admin"); } catch (e) {} }
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(error.message === "Invalid login credentials" ? "이메일 또는 비밀번호가 올바르지 않습니다." : "로그인 실패: " + error.message);
  };
  const doSignup = async () => {
    setErr(""); setInfo("");
    if (!email.trim().includes("@")) return setErr("올바른 이메일을 입력해 주세요.");
    if (name.trim().length < 2) return setErr("이름을 꼭 넣어 주세요. (2자 이상, 예: 홍길동)");
    if (pw.length < 6) return setErr("비밀번호는 6자 이상으로 정해주세요.");
    if (pw !== pw2) return setErr("비밀번호 확인이 일치하지 않습니다.");
    setBusy(true);
    const { data, error } = await sb.auth.signUp({
      email: email.trim(), password: pw, options: { data: { display_name: name.trim() } },
    });
    setBusy(false);
    if (error) return setErr("가입 실패: " + error.message);
    if (data && !data.session) setInfo("확인 이메일을 보냈습니다. 메일의 링크를 눌러 가입을 마친 뒤 로그인해 주세요.");
  };
  const doReset = async () => {
    setErr(""); setInfo("");
    if (!email.trim().includes("@")) return setErr("가입한 이메일을 입력해 주세요.");
    setBusy(true);
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href.split("#")[0] });
    setBusy(false);
    if (error) setErr("메일 발송 실패: " + error.message);
    else setInfo("비밀번호 재설정 메일을 보냈습니다. 메일의 링크를 눌러 돌아오면 새 비밀번호를 정할 수 있습니다.");
  };
  const go = mode === "login" || mode === "admin" ? doLogin : mode === "signup" ? doSignup : doReset;
  const onKey = (e) => { if (e.key === "Enter") go(); };

  return (
    <div className="app"><style>{CSS}</style>
      <div className="auth-wrap"><div className="auth-card">
        <div className="auth-brand"><Mark size={60} /><h1>묵상이음</h1><p>{mode === "admin" ? "전체 관리자 로그인 — 모든 교회 현황" : "말씀 앞에 머문 시간을 함께 나눕니다"}</p></div>
        {mode !== "admin" && <div className="auth-tabs">
          <button className={mode === "login" ? "on" : ""} onClick={() => reset("login")}>로그인</button>
          <button className={mode === "signup" ? "on" : ""} onClick={() => reset("signup")}>계정 만들기</button>
        </div>}
        <label className="field"><span>이메일</span>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={onKey} autoFocus />
        </label>
        {mode === "signup" && (
          <label className="field"><span>이름 <b style={{ color: "var(--danger)" }}>*필수</b> (교회 명단·나눔에 표시됩니다)</span>
            <input value={name} placeholder="예: 홍길동" required maxLength={20} onChange={(e) => setName(e.target.value)} onKeyDown={onKey} />
          </label>
        )}
        {mode !== "reset" && (
          <label className="field"><span>비밀번호</span>
            <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={onKey} />
          </label>
        )}
        {mode === "signup" && (
          <label className="field"><span>비밀번호 확인</span>
            <input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={onKey} />
          </label>
        )}
        {err && <p className="auth-err">{err}</p>}
        {info && <p className="auth-hint">{info}</p>}
        <button className="primary auth-submit" disabled={busy} onClick={go}>
          {busy ? "처리 중…" : mode === "login" ? "로그인" : mode === "admin" ? "관리자로 로그인" : mode === "signup" ? "계정 만들기" : "재설정 메일 보내기"}
        </button>
        {mode === "admin" && (
          <p className="auth-note"><button className="text-link" onClick={() => reset("login")}>← 일반 로그인으로</button></p>
        )}
        {mode === "login" && (

/* ── 교회 사용 현황 (전체 관리자만) — 교회이음 운영자 화면과 같은 틀 ── */
const agoText = (t) => {
  if (!t) return "-";
  const d = Math.floor((Date.now() - new Date(t).getTime()) / 86400000);
  return d <= 0 ? "오늘" : d === 1 ? "어제" : d < 30 ? d + "일 전" : Math.floor(d / 30) + "달 전";
};
function OwnerBoard({ onClose, closeLabel, onPick }) {
  const [rows, setRows] = useState(null);
  const [tot, setTot] = useState(null);
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");
  const [drop, setDrop] = useState(null);
  const [busy, setBusy] = useState("");
  const [newName, setNewName] = useState("");
  const load = async () => {
    setErr("");
    try {
      const a = await sb.rpc("super_church_overview");
      const b = await sb.rpc("super_totals");
      if (a.error) { setErr(/function|schema cache|does not exist|column/i.test(a.error.message || "") ? "사용 현황 기능이 아직 없습니다. Supabase SQL Editor에서 '묵상이음-부서명단.sql'을 실행해 주세요." : a.error.message); setRows([]); return; }
      setRows(a.data || []); setTot((b.data || [])[0] || null);
    } catch (e) { setErr("불러오지 못했습니다"); setRows([]); }
  };
  useEffect(() => { load(); }, []);
  /* 쓰고 있나: 최근 2주 안에 묵상이 있으면 쓰는 중 */
  const state = (r) => {
    if (!Number(r.members)) return { t: "시작 안 함", c: "st-none" };
    if (!r.last_date) return { t: "교인만 들어옴", c: "st-part" };
    const d = Math.floor((Date.now() - new Date(r.last_date + "T12:00:00").getTime()) / 86400000);
    if (d <= 14) return { t: "쓰는 중", c: "st-live" };
    if (d <= 45) return { t: "멈춘 듯", c: "st-part" };
    return { t: "안 쓰는 듯", c: "st-none" };
  };
  const doDrop = async () => {
    const r = drop; setBusy(r.id); setErr("");
    const { error } = await sb.rpc("delete_church", { p_church: r.id, p_name: r.name });
    setBusy(""); setDrop(null);
    if (error) { setErr("지우지 못했습니다 — " + error.message); return; }
    setMsg(`${r.name}을(를) 지웠습니다.`); setTimeout(() => setMsg(""), 4000);
    load();
  };
  const create = async () => {
    if (newName.trim().length < 2) return;
    const { data, error } = await sb.rpc("create_church", { p_name: newName.trim() });
    if (error) { setErr("교회를 만들지 못했습니다 — " + error.message); return; }
    setNewName(""); setMsg(`${data[0].name} 등록 · 초대 코드 ${data[0].code}`); setTimeout(() => setMsg(""), 6000); load();
  };
  if (rows === null) return <div className="center-box"><div className="panel empty">현황을 불러오는 중…</div></div>;
  const live = rows.filter((r) => state(r).t === "쓰는 중").length;
  const totalMembers = rows.reduce((a, r) => a + Number(r.members || 0), 0);
  const totalKids = rows.reduce((a, r) => a + Number(r.kids || 0), 0);
  return (
    <div className="wrap">
      <div className="panel">
        <div className="own-top">
          <h2>교회 사용 현황
            <span className="muted small"> 교회 {rows.length}곳 · 쓰는 중 {live}곳 · 교인 합계 {totalMembers}명 (어린이 {totalKids}명)</span></h2>
          <div className="own-top-act">
            <button className="ghost sm" onClick={load}>새로 보기</button>
            <button className="primary sm" onClick={onClose}>{closeLabel || "닫기"}</button>
          </div>
        </div>
        {tot && <p className="muted small" style={{ margin: "4px 0 0" }}>묵상이음 회원 {Number(tot.members)}명 · 교회 없는 회원 {Number(tot.no_church)}명 · 오늘 쓴 묵상 {Number(tot.meds_today)}편</p>}
        {msg && <p className="small" style={{ margin: "8px 0 0", color: "var(--green)" }}>{msg}</p>}
        {err && <p className="auth-err">{err}</p>}
        {rows.length === 0 && !err && <p className="empty">아직 만들어진 교회가 없습니다.</p>}
        {rows.map((r) => {
          const st = state(r);
          return (
            <div className="own-row" key={r.id}>
              <div className="own-main">
                <div className="own-name">{r.name}<span className={"own-st " + st.c}>{st.t}</span></div>
                <div className="muted small">{r.admins ? "관리자 " + r.admins : "관리자 없음"} · 초대 코드 <code>{r.code}</code></div>
              </div>
              <div className="own-nums">
                <div><b>{Number(r.adults)}</b><span>장년부</span></div>
                <div><b>{Number(r.kids)}</b><span>어린이</span></div>
                <div><b>{Number(r.active_7d)}</b><span>7일 묵상한 사람</span></div>
                <div><b>{Number(r.meds)}</b><span>묵상 편수</span></div>
                <div><b>{r.last_date ? agoText(r.last_date + "T12:00:00") : "-"}</b><span>마지막 묵상</span></div>
                <div><b>{agoText(r.last_seen)}</b><span>마지막 접속</span></div>
              </div>
              <div className="own-act">
                <button className="ghost sm" onClick={() => onPick(r.id)}>들어가 보기</button>
                <button className="danger sm" disabled={busy === r.id} onClick={() => setDrop(r)}>{busy === r.id ? "지우는 중…" : "지우기"}</button>
              </div>
            </div>
          );
        })}
        <div className="join-row" style={{ maxWidth: 460 }}>
          <input value={newName} placeholder="새 교회 이름" style={{ letterSpacing: 0 }} onChange={(e) => setNewName(e.target.value)} />
          <button className="ghost" onClick={create}>교회 등록</button>
        </div>
        <p className="small muted" style={{ marginTop: 14 }}>
          <b>쓰는 중</b>은 최근 2주 안에 묵상이 올라온 교회입니다. <b>멈춘 듯</b>은 한 달 반 안, 그보다 오래되면 <b>안 쓰는 듯</b>으로 봅니다.
          교인이 한 명도 없으면 <b>시작 안 함</b>입니다. 이 화면은 전체 관리자에게만 보입니다.
        </p>
      </div>
      {drop && <NameConfirm title={`[전체 관리자] ${drop.name}을(를) 지웁니다.`} name={drop.name} busy={busy === drop.id}
        body={`교인 ${Number(drop.members)}명(장년부 ${Number(drop.adults)} · 어린이 ${Number(drop.kids)}), 묵상 ${Number(drop.meds)}편, 말씀 ${Number(drop.words)}개가 모두 사라집니다. 교인들은 '교회 없음'이 됩니다. 되돌릴 수 없습니다.`}
        onCancel={() => setDrop(null)} onConfirm={doDrop} />}
    </div>
  );
}

/* ── 문지기: 대문 → 로그인 → 앱 ── */
function AuthGate() {
  /* 대문 → 들어가기. 새로고침해도 유지되고, 앱(창)을 닫으면 다시 대문부터 */
  const [entered, setEntered0] = useState(() => { try { return sessionStorage.getItem("med-entered") === "1"; } catch (e) { return false; } });
  const setEntered = (v) => { try { if (v) sessionStorage.setItem("med-entered", "1"); else sessionStorage.removeItem("med-entered"); } catch (e) {} setEntered0(v); };
  const [session, setSession] = useState(undefined);
  const [recovery, setRecovery] = useState(false);
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess || null);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);
  const sessIsSuper = !!(session && session.user && (session.user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase());
  const sessName = session && session.user ? String((session.user.user_metadata || {}).display_name || (session.user.user_metadata || {}).name || session.user.email || "") : "";
  let lastChurch = "";
  try { lastChurch = session ? (localStorage.getItem("med-church-name") || "") : ""; } catch (e) {}
  if (!entered) return <Landing onEnter={() => { try { sessionStorage.removeItem("med-admin"); } catch (e) {} setEntered(true); }}
    userName={sessName} churchName={lastChurch} onLogout={session ? () => sb.auth.signOut() : null}
    adminLabel={sessIsSuper ? "전체 현황판 (가입 교회·교인 현황)" : "전체 관리자 로그인"}
    onAdmin={session && !sessIsSuper ? null : () => {
      try { if (sessIsSuper) sessionStorage.setItem("med-admin", "1"); else sessionStorage.setItem("med-admin-login", "1"); } catch (e) {}
      setEntered(true);
    }} />;
  if (!sb) return <SetupScreen />;
  if (session === undefined) return <div className="app"><style>{CSS}</style><div className="auth-wrap"><p className="muted">불러오는 중…</p></div></div>;
  if (recovery && session) return <NewPasswordScreen onDone={() => setRecovery(false)} />;
  if (!session) return <LoginScreen />;
  const u = session.user;
  let adminMode = false;
  try { adminMode = sessionStorage.getItem("med-admin") === "1"; } catch (e) {}
  if (adminMode && (u.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
    return <SuperDashboard user={u} onHome={() => { try { sessionStorage.removeItem("med-admin"); } catch (e) {} setEntered(false); }}
      onApp={() => { try { sessionStorage.removeItem("med-admin"); } catch (e) {} setSession({ ...session }); }}
      onLogout={() => { try { sessionStorage.removeItem("med-admin"); } catch (e) {} sb.auth.signOut(); }} />;
  }
  const md = u.user_metadata || {};
  /* 설교이음·교회이음에서 만든 계정은 이름 칸 이름이 다를 수 있어 여러 칸을 봅니다. 없으면 빈칸 → 묵상이음에서 이름을 받습니다 */
  const profileName = String(md.display_name || md.name || md.full_name || "").trim();
  return <MeditationApp user={u} profileName={profileName}
    onHome={() => setEntered(false)} onLogout={() => { try { localStorage.removeItem("med-church-name"); } catch (e) {} sb.auth.signOut(); }} />;
}

/* ═══════════════════ 본 앱 ═══════════════════ */

    try { if (c && c !== "legacy" && c.dept && localStorage.getItem("med-aud") === null) setAudience(c.dept === "kids" ? "kids" : "adult"); } catch (e) {}

  const [picker, setPicker] = useState(false);     /* 교회 고르기 화면 (교회 바꾸기) */

    try { await sb.from("meditation_members").upsert([{ user_id: user.id, name: n, email: user.email || "", last_seen: new Date().toISOString() }], { onConflict: "user_id" }); } catch (e) {}
  };
  const removeMember = (m) => setAsk({

      setMsg(`${m.name}님을 삭제했습니다.`); setTimeout(() => setMsg(""), 3000);
      loadMemberStats(); fetchAll();
    },
  });
  const [joinCode, setJoinCode] = useState("");
  const [joinErr, setJoinErr] = useState("");
  const [churchList, setChurchList] = useState(null);
  const [newChurch, setNewChurch] = useState("");
  const loadChurchList = async () => {

  /* 관리자: 말씀 저장 / 삭제 */

  /* 관리자: 교재 PDF로 한 주치 말씀 올리기 */
  const [imp, setImp] = useState(null);   /* null | { status, err, title, passage, monday, entries } */
  /* 말씀 올리기 하나로: 직접 쓰기 ↔ 교재 파일 */

  const openImport = () => { setWordForm(null); setImp({ status: "", err: "", title: "", passage: "", monday: mondayOf(wordDate), entries: [], paste: "", showPaste: false, audience, audGuess: false, mode: "week", day: wordDate }); };
  /* 하루만 올리기: 고른 묵상 하나만 켜고, 그 날짜로 */
  const dayPick = (entries, day, idx, monday) => {
    const mon = monday || mondayOf(day);
    if (!entries.length) return entries;
    let k = idx;
    if (k === undefined || k < 0) {
      k = entries.findIndex((e) => e.date === day);
      if (k < 0) { const dow = (new Date(day + "T12:00:00").getDay() + 6) % 7; k = entries.findIndex((e) => e.off === dow); }
      if (k < 0) k = 0;
    }
    return entries.map((e, j) => (j === k ? { ...e, on: true, date: day, fixedDate: true }
      : { ...e, on: false, fixedDate: !!e.fileDate, date: e.fileDate ? e.date0 : shiftDate(mon, e.off) }));
  };
  const setImpMode = (mode) => setImp((p) => {

    if (mode === "day") return { ...p, mode, entries: dayPick(p.entries, p.day, undefined, p.monday) };
    /* 한 주로 돌아가면 원래 날짜로 */
    return { ...p, mode, entries: p.entries.map((e) => ({ ...e, on: true, fixedDate: !!e.fileDate, date: e.fileDate ? e.date0 : shiftDate(p.monday, e.off) })) };
  });
  const setImpDay = (day) => setImp((p) => {

  });
  const applyParsed = (paras, meta, what) => {
    if (!paras.length) {
      setImp((p) => ({ ...p, status: "", err: what === "PDF"
        ? "이 PDF에서 글자를 찾지 못했습니다. 사진을 찍어 만든(스캔) PDF는 읽을 수 없으니, 원본 파일(Word·한글)이나 글 붙여넣기를 이용해 주세요."
        : "읽을 글이 없습니다." }));
      return;
    }
    const parsed = parseAnyDevotional(paras, meta);
    const kids = KIDS_RE.test(paras.slice(0, 80).join(" "));
    setImp((p) => {
      const r = unitsToEntries(parsed, p.monday);
      if (!r.entries.length) return { ...p, status: "", err: "묵상 내용을 찾지 못했습니다. 본문·묵상·질문·기도 같은 제목이 있는지 확인해 주세요." };
      return { ...p, status: "", err: "", title: r.title, passage: r.passage, source: what,

  const readFile = async (file) => {

    setImp((p) => ({ ...p, status: `${what} 파일을 읽는 중…`, err: "", entries: [] }));

  };

  /* 교재에 날짜가 적힌 날은 그 날짜 그대로, 요일만 있는 날은 고른 주로 옮김 */
  const moveWeek = (monday) => setImp((p) => ({ ...p, monday, entries: p.entries.map((e) => (e.fixedDate ? e : { ...e, date: shiftDate(monday, e.off) })) }));
  const saveImport = async () => {
    const list = imp.entries.filter((e) => e.on);
    if (!list.length) { setImp((p) => ({ ...p, err: "올릴 날을 하나 이상 골라 주세요." })); return; }
    let added = 0, updated = 0, skipped = 0, fail = "";
    const savedRows = [];
    for (const e of list) {
      setImp((p) => ({ ...p, status: `올리는 중… ${added + updated + skipped + 1} / ${list.length}` }));
      if (!e.date || !e.book || !filled(e.verse)) { skipped++; if (!fail) fail = `${e.label}: 날짜·성경·본문이 비어 있어 건너뜀`; continue; }
      const t = (v) => cleanText(v).trim();
      const row = { date: e.date, title: t(e.title), book: t(e.book), ref: t(e.ref), verse: t(e.verse),
        background: t(e.background), commentary: t(e.commentary), key_verse: t(e.key_verse), guide: composeGuide(t(e.guide), t(e.qs)), prayer: t(e.prayer),
        ...(imp.audience === "kids" || words.some((x) => x.audience) ? { audience: imp.audience || "adult" } : {}),
        ...((() => { const v = ytId(e.video_url) ? t(e.video_url) : (ytId(imp.video) ? t(imp.video) : ""); return v || words.some((x) => "video_url" in x) ? { video_url: v } : {}; })()) };
      const old = wordOf(e.date, imp.audience || "adult");
      if (old && !e.overwrite) { skipped++; continue; }
      const res = old
        ? await sb.from("daily_words").update(row).eq("id", old.id).select()
        : await sb.from("daily_words").insert([row]).select();
      if (res.error || !res.data || !res.data.length) { skipped++; if (!fail) fail = res.error && /video_url/i.test(res.error.message || "") ? "설교 영상 칸이 없습니다 — '묵상이음-설교영상.sql'을 실행해 주세요" : (res.error && res.error.message) || "저장 실패"; continue; }
      savedRows.push(res.data[0]); if (old) updated++; else added++;
    }
    setWords((p) => {
      const ids = new Set(savedRows.map((x) => x.id));
      return [...savedRows, ...p.filter((x) => !ids.has(x.id))].sort((a, b) => b.date.localeCompare(a.date));
    });
    const msgText = `새로 ${added}일, 바꿈 ${updated}일` + (skipped ? `, 건너뜀 ${skipped}일` : "") + (fail ? ` (${fail})` : "");
    if (added + updated > 0) {
      setImp(null);
      setMsg("교재를 올렸습니다 — " + msgText);
      setTimeout(() => setMsg(""), 6000);
      setWordDate(savedRows.map((x) => x.date).sort()[0]);
    } else {
      setImp((p) => ({ ...p, status: "", err: "올린 날이 없습니다 — " + msgText + ". 이미 말씀이 있는 날은 '덮어쓰기'를 켜야 바뀝니다." }));
    }
  };
  const impField = (i, e, key, label, rows) => (
    <label className="field" key={key}><span>{label}</span>
      {rows
        ? <textarea rows={rows} value={e[key] || ""} onChange={(ev) => setEntry(i, { [key]: ev.target.value })} />
        : <input value={e[key] || ""} onChange={(ev) => setEntry(i, { [key]: ev.target.value })} />}
    </label>
  );
  const wordFormField = (key, label, opts = {}) => (
    <label className="field" key={key}><span>{label}</span>
      {opts.rows
        ? <textarea rows={opts.rows} value={wordForm[key] || ""} placeholder={opts.ph || ""}
            onChange={(e) => setWordForm({ ...wordForm, [key]: e.target.value })} />
        : <input value={wordForm[key] || ""} placeholder={opts.ph || ""}
            onChange={(e) => setWordForm({ ...wordForm, [key]: e.target.value })} />}
    </label>
  );
  useEffect(() => { loadChurch().then(() => fetchAll()).then(() => setLoaded(true)); }, []);

  /* 묵상이음 회원으로 기록 (가입자 현황용) — 표가 없으면 조용히 넘어감 */
  useEffect(() => {
    try {
      sb.from("meditation_members").upsert([{ user_id: user.id, ...(filled(profileName) ? { name: cleanText(profileName) } : {}), email: user.email || "", last_seen: new Date().toISOString() }], { onConflict: "user_id" })
        .then(() => {}, () => {});
    } catch (e) {}
  }, []);

  /* 이 말씀으로 묵상한 사람 명단 */
  const [meditators, setMeditators] = useState({});   /* wordId → [{name, done}] | "nosql" */
  const loadMeditators = async (wid) => {
    if (!wid) return;
    let data = null, error = true;
    try { ({ data, error } = await sb.rpc("word_meditators", { p_word: wid })); } catch (e) { error = e; }
    setMeditators((p) => ({ ...p, [wid]: error ? "nosql" : (data || []) }));
  };
  useEffect(() => { if (loaded && currentWord) loadMeditators(currentWord.id); }, [loaded, currentWord && currentWord.id]);

  /* 관리자: 가입자 현황 */
  const [memberStats, setMemberStats] = useState(null);   /* null | "loading" | "nosql" | [] */
  const loadMemberStats = async () => {
    setMemberStats("loading");
    let data = null, error = true;
    try { ({ data, error } = await sb.rpc("meditation_member_stats")); } catch (e) { error = e; }
    setMemberStats(error ? "nosql" : (data || []));
  };

  /* 내 묵상 = 내가 쓴 모든 묵상 / 함께 나눔 = 나눔으로 공개된 모든 묵상 */
  const scoped = useMemo(
    () => library === "personal" ? items.filter((x) => x.mine) : items.filter((x) => x.scope === "shared"),
    [items, library]
  );

  /* ── 묵상 습관 통계 ── */
  const stats = useMemo(() => {
    const mine = items.filter((x) => x.mine);
    const days = new Set(mine.map((x) => x.date).filter(Boolean));
    const ym = today().slice(0, 7);
    const monthDays = [...days].filter((d) => d.startsWith(ym)).length;
    /* 연속 일수: 오늘(없으면 어제)부터 거꾸로 */
    let streak = 0;
    const d = new Date();
    if (!days.has(d.toLocaleDateString("sv-SE"))) d.setDate(d.getDate() - 1);
    while (days.has(d.toLocaleDateString("sv-SE"))) { streak++; d.setDate(d.getDate() - 1); }
    return { total: mine.length, monthDays, streak, shared: mine.filter((x) => x.scope === "shared").length };
  }, [items]);

  const years = useMemo(() => {
    const ys = new Set(scoped.map((s) => (s.date || "").slice(0, 4)).filter(Boolean));
    return ["전체", ...[...ys].sort().reverse()];
  }, [scoped]);
  const allTags = useMemo(() => {
    const t = new Set(); scoped.forEach((s) => (s.tags || []).forEach((x) => t.add(x)));
    return ["전체", ...[...t].sort((a, b) => a.localeCompare(b, "ko"))];
  }, [scoped]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return scoped.filter((s) => {
      if (fYear !== "전체" && (s.date || "").slice(0, 4) !== fYear) return false;
      if (fTag !== "전체" && !(s.tags || []).includes(fTag)) return false;
      if (!q) return true;
      return [s.title, s.book, s.ref, s.verse, s.content, s.apply, s.prayer, s.author, (s.answers || []).join(" "), (s.tags || []).join(" ")]
        .join(" ").toLowerCase().includes(q);
    });
  }, [scoped, query, fYear, fTag]);

  const amenCount = (id) => amens.filter((a) => a.meditation_id === id).length;
  const iAmened = (id) => amens.some((a) => a.meditation_id === id && a.user_id === user.id);

  /* ── 쓰기 / 고치기 / 지우기 ── */
  const startNew = () => {
    setForm({ ...EMPTY_FORM, date: today() });
    setEditingId(null);
    setSaveScope(library === "shared" ? "shared" : "personal");
    setView("form");
  };
  const startEdit = (s) => {
    setForm({ ...s, tags: (s.tags || []).join(", ") });
    setEditingId(s.id);
    setSaveScope(s.scope);
    setView("form");
  };
  const saveForm = async () => {
    if (!form.content.trim() && !form.title.trim()) return;
    const rec = {
      ...form,
      title: form.title.trim() || (form.book ? `${form.book} ${form.ref}`.trim() : "제목 없는 묵상"),
      tags: String(form.tags || "").split(",").map((t) => t.trim()).filter(Boolean),
    };
    const row = rowFrom(rec, saveScope, profileName);
    const res = editingId
      ? await sb.from("meditations").update(row).eq("id", editingId).select()
      : await sb.from("meditations").insert([row]).select();
    if (res.error || !res.data || !res.data.length) {
      setErr(res.error ? res.error.message : "저장 권한이 없거나 기록을 찾지 못했습니다");
      return;
    }
    const saved = recFrom(res.data[0], user.id);
    setItems((prev) => editingId ? prev.map((x) => (x.id === editingId ? saved : x)) : [saved, ...prev]);
    setErr("");
    setLibrary(saveScope === "shared" && library === "shared" ? "shared" : "personal");
    setOpenId(saved.id);
    setView("list");
  };
  const remove = async (id) => {
    const target = items.find((x) => x.id === id);
    const { data, error } = await sb.from("meditations").delete().eq("id", id).select();
    setConfirmDel(null);
    if (error) { setErr("삭제 실패 — " + error.message); return; }
    if (!data || !data.length) {
      setErr(target && !target.mine
        ? "다른 사람의 묵상은 지울 권한이 없습니다. Supabase SQL Editor에서 '묵상이음-삭제권한.sql'을 실행해 주세요."
        : "삭제되지 않았습니다 — 다시 로그인한 뒤 시도해 주세요.");
      return;
    }
    if (target && target.wordId) { try { localStorage.removeItem("med-draft-" + target.wordId); } catch (e) {} }
    setItems((prev) => prev.filter((x) => x.id !== id));
    setOpenId(null); setErr("");
    setMsg("묵상을 삭제했습니다."); setTimeout(() => setMsg(""), 3000);
    if (target && target.wordId) loadMeditators(target.wordId);
  };
  const askRemove = (s) => setAsk({
    text: s.mine ? `'${s.title || "이 묵상"}'을(를) 삭제할까요?\n아멘과 댓글도 함께 지워지며 되돌릴 수 없습니다.`
      : `${s.author || "이름 없음"}님의 묵상을 관리자 권한으로 삭제할까요?\n아멘과 댓글도 함께 지워지며 되돌릴 수 없습니다.`,
    ok: "삭제", run: () => remove(s.id),
  });

  /* ── 아멘 / 댓글 ── */
  const toggleAmen = async (id) => {
    if (iAmened(id)) {
      const { error } = await sb.from("meditation_amens").delete().eq("meditation_id", id).eq("user_id", user.id);
      if (!error) setAmens((p) => p.filter((a) => !(a.meditation_id === id && a.user_id === user.id)));
    } else {
      const { error } = await sb.from("meditation_amens").insert([{ meditation_id: id }]);
      if (!error) setAmens((p) => [...p, { meditation_id: id, user_id: user.id }]);
      else setErr(error.message);
    }
  };
  const loadComments = async (id) => {
    const { data, error } = await sb.from("meditation_comments").select("*")
      .eq("meditation_id", id).order("created_at", { ascending: true });
    if (!error) setComments((p) => ({ ...p, [id]: data || [] }));
  };
  const addComment = async (id) => {
    const body = cleanText(commentInput[id] || "").trim();
    if (!body) return;
    const { data, error } = await sb.from("meditation_comments")
      .insert([{ meditation_id: id, author_name: cleanText(profileName), body }]).select();
    if (error) { setErr(error.message); return; }
    setComments((p) => ({ ...p, [id]: [...(p[id] || []), ...(data || [])] }));
    setCommentInput((p) => ({ ...p, [id]: "" }));
  };
  const deleteComment = async (mid, cid) => {
    const { data, error } = await sb.from("meditation_comments").delete().eq("id", cid).select();
    if (error || !data || !data.length) { setErr(error ? "댓글 삭제 실패 — " + error.message : "댓글을 지울 권한이 없습니다. '묵상이음-삭제권한.sql'을 실행해 주세요."); return; }
    setComments((p) => ({ ...p, [mid]: (p[mid] || []).filter((c) => c.id !== cid) }));
  };
  const toggleOpen = (s) => {
    const next = openId === s.id ? null : s.id;
    setOpenId(next);
    if (next && s.scope === "shared" && !comments[s.id]) loadComments(s.id);
  };

  /* ── 백업 / 가져오기 ── */
  const exportData = () => {
    const mine = items.filter((x) => x.mine);
    const blob = new Blob([JSON.stringify({ meditations: mine }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "묵상이음-백업-" + today() + ".json"; a.click();
    URL.revokeObjectURL(url);
  };
  const importData = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const arr = Array.isArray(data) ? data : (data.meditations || []);
      const rows = arr.filter((r) => r && (r.title || r.content))
        .map((r) => rowFrom(r, r.scope === "shared" ? "shared" : "personal", profileName));
      if (!rows.length) { setMsg("가져올 묵상이 없습니다."); return; }
      let ok = 0;
      for (let i = 0; i < rows.length; i += 5) {
        setMsg(`가져오는 중… ${Math.min(i + 5, rows.length)} / ${rows.length}`);
        const r = await sb.from("meditations").insert(rows.slice(i, i + 5)).select();
        if (!r.error && r.data) { ok += r.data.length; setItems((p) => [...r.data.map((x) => recFrom(x, user.id)), ...p]); }
      }
      setMsg(`완료 — ${ok}편을 가져왔습니다.`);
    } catch (err2) {
      setMsg("가져오기에 실패했습니다. 묵상이음 백업 파일(JSON)인지 확인해 주세요.");
    }
  };

  /* ── 지도용 집계 ── */
  const bookCounts = useMemo(() => {
    const m = {}; scoped.forEach((s) => { if (s.book) m[s.book] = (m[s.book] || 0) + 1; }); return m;
  }, [scoped]);
  const maxBook = Math.max(1, ...Object.values(bookCounts));
  const tagCounts = useMemo(() => {
    const m = {}; scoped.forEach((s) => (s.tags || []).forEach((t) => { m[t] = (m[t] || 0) + 1; })); return m;
  }, [scoped]);
  const tagList = Object.entries(tagCounts).sort((a, b) => a[0].localeCompare(b[0], "ko"));
  const maxTag = Math.max(1, ...Object.values(tagCounts));

  const label = (s) => s.book ? `${s.book}${s.ref ? " " + s.ref : ""}` : "본문 미기록";

  /* 지도 아래 목록 한 줄 */
  const MiniList = ({ list }) => (
    <ul>
      {list.map((s) => (
        <li key={s.id}>
          <button className="link" onClick={() => { setQuery(""); setFYear("전체"); setFTag("전체"); setListMode("list"); setView("list"); setOpenId(s.id); }}>
            <span className="scripture">{label(s)}</span> {s.title}
            <span className="date"> · {s.date || "날짜 없음"}{library === "shared" && s.author ? " · " + s.author : ""}</span>
          </button>
        </li>
      ))}
    </ul>
  );

  /* ── 묵상 카드 본문 ── */
  const Section = ({ name, text, cls }) => text ? (
    <div className={"med-sec " + (cls || "")}><b>{name}</b><div>{text}</div></div>
  ) : null;

  /* ── 이름이 없는 계정(다른 이음 앱에서 만든 계정 등): 이름부터 받기 ── */
  if (!filled(profileName)) {
    return (
      <div className="app"><style>{CSS}</style>
        <header className="masthead"><div className="masthead-inner"><div className="brand">
          <Mark size={36} />
          <div className="brand-text"><h1>묵상이음</h1><p className="brand-sub">{user.email}</p></div>
          <div className="head-links">
            <button className="logout-btn" onClick={onHome}>대문</button>
            <button className="logout-btn" onClick={onLogout}>로그아웃</button>
          </div>
        </div></div></header>
        <main className="container narrow">
          <section className="join-card">
            <h2>이름을 알려 주세요</h2>
            <p>교회 명단과 나눔에 표시될 이름입니다. 이름을 넣어야 묵상이음을 쓸 수 있습니다.</p>
            <div className="join-row">
              <input value={nameInput} maxLength={20} placeholder="예: 홍길동" style={{ letterSpacing: 0 }}
                onChange={(e) => setNameInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") saveName(); }} />
              <button className="primary" onClick={saveName}>저장</button>
            </div>
            {nameErr && <p className="auth-err">{nameErr}</p>}
          </section>
        </main>
      </div>
    );
  }

  /* ── 교회 고르기 · 만들기 · 초대 코드로 들어가기 (교회이음과 같은 틀) ── */
  if (church === undefined || church === null || picker) {
    const mine = [];
    if (church && church !== "legacy") mine.push({ id: church.id, name: church.name, admin: church.role === "admin", code: church.code, cur: true, dept: church.dept });
    adminChurches.forEach((c) => { if (!mine.some((m) => m.id === c.id)) mine.push({ id: c.id, name: c.name, admin: true, code: c.code }); });
    const doDrop = async () => {
      const r = dropChurch; setDropBusy(true);
      let res;
      try { res = await sb.rpc("delete_church", { p_church: r.id, p_name: r.name }); } catch (e) { res = { error: e }; }
      setDropBusy(false); setDropChurch(null);
      if (res.error) { setJoinErr(/function|schema cache/i.test(res.error.message || "") ? "교회 지우기 기능이 아직 없습니다. '묵상이음-부서명단.sql'을 실행해 주세요." : "지우지 못했습니다 — " + res.error.message); return; }
      setMsg(`${r.name}을(를) 지웠습니다.`); setTimeout(() => setMsg(""), 4000);
      await loadAdminChurches();
      if (r.cur) { await loadChurch(); setWords([]); setItems([]); }
    };
    return (
      <div className="app"><style>{CSS}</style>
        <header className="masthead"><div className="masthead-inner"><div className="brand">
          <Mark size={36} />
          <div className="brand-text"><h1>묵상이음</h1><p className="brand-sub">{profileName}님, 환영합니다</p></div>
          <div className="head-links">
            <button className="logout-btn" onClick={onHome}>대문</button>
            <button className="logout-btn" onClick={onLogout}>로그아웃</button>
          </div>
        </div></div></header>
        {msg && <div className="banner">{msg}</div>}
        {church === undefined ? <div className="center-box"><div className="panel empty">교회를 확인하는 중…</div></div>
        : board ? <OwnerBoard onClose={() => setBoard(false)} onPick={(id) => joinChurch({ p_church: id })} />
        : (
          <div className="center-box">
            <div className="panel picker">
              <div className="logo-line"><Mark size={30} /> 묵상이음</div>
              <p className="small muted" style={{ marginTop: 0 }}>{user.email} 님으로 접속했습니다.</p>
              {joinErr && <p className="auth-err">{joinErr}</p>}

              {mine.length > 0 && (<>
                <h2>내 교회</h2>
                {mine.map((r) => (
                  <div className="ch-row" key={r.id}>
                    <div style={{ flex: 1 }}>
                      <b>{r.name}</b>{r.cur && <span className="pill shared" style={{ marginLeft: 6 }}>지금 교회</span>}
                      <div className="muted small">{r.admin ? "관리자" : (r.dept === "kids" ? "어린이" : "장년부") + " 교인"}{r.admin && r.code && ` · 초대 코드 ${r.code}`}</div>
                    </div>
                    <button className="primary sm" onClick={() => r.cur ? setPicker(false) : joinChurch({ p_church: r.id })}>들어가기</button>
                    {r.admin && <button className="danger sm" onClick={() => setDropChurch(r)}>지우기</button>}
                  </div>
                ))}
              </>)}

              {pickMode === "" && (<>
                <div className="pick-actions">
                  <button className="primary" onClick={() => { setJoinErr(""); setPickMode("new"); }}>+ 우리 교회 만들기</button>
                  <button className="ghost" onClick={() => { setJoinErr(""); setPickMode("join"); }}>초대 코드로 들어가기</button>
                  {isSuper && <button className="ghost" onClick={() => setBoard(true)}>사용 현황</button>}
                  {church && church !== "legacy" && <button className="ghost" onClick={() => setPicker(false)}>돌아가기</button>}
                </div>
                {mine.length === 0 && <p className="small muted" style={{ marginTop: 12 }}>
                  묵상이음은 교회별로 나뉘어 있어서, 같은 교회 성도끼리만 나눔과 명단이 보입니다. 교회 관리자에게 받은 <b>초대 코드</b>로 들어오세요.</p>}
              </>)}

              {pickMode === "new" && (
                <div style={{ marginTop: 16 }}>
                  <h2>우리 교회 만들기</h2>
                  <p className="small muted" style={{ marginTop: 0 }}>
                    교회를 만든 분이 <b>관리자</b>가 됩니다. 만들고 나면 <b>초대 코드</b>가 생기는데, 그 코드를 교인들에게 알려 주면 각자 들어올 수 있습니다.</p>
                  <label className="field"><span>교회 이름</span>
                    <input value={newChurch} placeholder="예) 한빛교회" onChange={(e) => setNewChurch(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") makeChurch(); }} /></label>
                  <div className="pick-actions">
                    <button className="primary" disabled={newChurch.trim().length < 2} onClick={makeChurch}>만들기</button>
                    <button className="ghost" onClick={() => setPickMode("")}>취소</button>
                  </div>
                </div>
              )}

              {pickMode === "join" && (
                <div style={{ marginTop: 16 }}>
                  <h2>초대 코드로 들어가기</h2>
                  <p className="small muted" style={{ marginTop: 0 }}>교회 관리자에게 받은 <b>6자리 코드</b>를 넣고 부서를 골라 주세요. 승인 없이 바로 들어갑니다.</p>
                  <label className="field"><span>초대 코드</span>
                    <input value={joinCode} maxLength={6} placeholder="ABC123" className="code-input"
                      onChange={(e) => setJoinCode(e.target.value.toUpperCase())}
                      onKeyDown={(e) => { if (e.key === "Enter" && joinCode.length >= 4) joinChurch({ p_code: joinCode, p_dept: joinDept }); }} /></label>
                  <div className="field"><span>부서</span>
                    <div className="aud-toggle sm" style={{ margin: "4px 0 0" }}>
                      {Object.entries(AUDIENCES).map(([k, n]) => (
                        <button key={k} className={joinDept === k ? "on " + k : ""} onClick={() => setJoinDept(k)}>{k === "kids" ? "🌻 " : "📖 "}{n}</button>
                      ))}
                    </div>
