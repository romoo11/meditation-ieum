/* ── 도우미 ── */
const today = () => new Date().toLocaleDateString("sv-SE"); /* YYYY-MM-DD (현지 시간) */
const shiftDate = (ymd, n) => {
  const [y, m, d] = ymd.split("-").map(Number);
  const t = new Date(y, m - 1, d + n);
  return t.toLocaleDateString("sv-SE");
};
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const prettyDate = (ymd) => {
  if (!ymd) return "";
  const [y, m, d] = ymd.split("-").map(Number);
  return `${y}년 ${m}월 ${d}일 (${DOW[new Date(y, m - 1, d).getDay()]})`;
};
const cleanText = (s) => String(s == null ? "" : s)
  .replace(/\u0000/g, "").replace(/[\u0001-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "");

function heat(count, max) {
  if (!count) return "var(--cell-empty)";
  const t = Math.min(1, count / Math.max(1, max));
  return `hsl(160, 34%, ${84 - t * 50}%)`;
}

/* 묵상 ↔ 서버 행 변환 */
function rowFrom(r, scope, authorName) {
  return {
    scope: scope || "personal",
    author_name: cleanText(authorName),
    date: cleanText(r.date),
    book: cleanText(r.book),
    ref: cleanText(r.ref),
    title: cleanText(r.title),
    verse: cleanText(r.verse),
    content: cleanText(r.content),
    apply: cleanText(r.apply),
    prayer: cleanText(r.prayer),
    tags: Array.isArray(r.tags) ? r.tags.map(cleanText).filter(Boolean) : [],
    word_id: r.wordId || null,
  };
}
function recFrom(row, myId) {
  return {
    id: row.id,
    scope: row.scope || "personal",
    author: row.author_name || "",
    mine: row.user_id === myId,
    date: row.date || "",
    book: row.book || "",
    ref: row.ref || "",
    title: row.title || "",
    verse: row.verse || "",
    content: row.content || "",
    apply: row.apply || "",
    prayer: row.prayer || "",
    tags: Array.isArray(row.tags) ? row.tags : [],
    createdAt: row.created_at || "",
    wordId: row.word_id || null,
  };
}

/* ── 로그인 / 가입 / 비밀번호 재설정 ── */
function LoginScreen() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [name, setName] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);
  const reset = (m) => { setMode(m); setErr(""); setInfo(""); };

  const doLogin = async () => {
    setErr(""); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(error.message === "Invalid login credentials" ? "이메일 또는 비밀번호가 올바르지 않습니다." : "로그인 실패: " + error.message);
  };
  const doSignup = async () => {
    setErr(""); setInfo("");
    if (!email.trim().includes("@")) return setErr("올바른 이메일을 입력해 주세요.");
    if (name.trim().length < 2) return setErr("이름(표시명)은 2자 이상으로 정해주세요.");
    if (pw.length < 6) return setErr("비밀번호는 6자 이상으로 정해주세요.");
    if (pw !== pw2) return setErr("비밀번호 확인이 일치하지 않습니다.");
    setBusy(true);
    const { data, error } = await sb.auth.signUp({
      email: email.trim(), password: pw, options: { data: { display_name: name.trim() } },
    });
    setBusy(false);
    if (error) return setErr("가입 실패: " + error.message);
    if (data && !data.session) setInfo("확인 이메일을 보냈습니다. 메일의 링크를 눌러 가입을 마친 뒤 로그인해 주세요.");
  };
  const doReset = async () => {
    setErr(""); setInfo("");
    if (!email.trim().includes("@")) return setErr("가입한 이메일을 입력해 주세요.");
    setBusy(true);
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href.split("#")[0] });
    setBusy(false);
    if (error) setErr("메일 발송 실패: " + error.message);
    else setInfo("비밀번호 재설정 메일을 보냈습니다. 메일의 링크를 눌러 돌아오면 새 비밀번호를 정할 수 있습니다.");
  };
  const go = mode === "login" ? doLogin : mode === "signup" ? doSignup : doReset;
  const onKey = (e) => { if (e.key === "Enter") go(); };

  return (
    <div className="app"><style>{CSS}</style>
      <div className="auth-wrap"><div className="auth-card">
        <div className="auth-brand"><Mark size={60} /><h1>묵상이음</h1><p>말씀 앞에 머문 시간을 함께 나눕니다</p></div>
        <div className="auth-tabs">
          <button className={mode === "login" ? "on" : ""} onClick={() => reset("login")}>로그인</button>
          <button className={mode === "signup" ? "on" : ""} onClick={() => reset("signup")}>계정 만들기</button>
        </div>
        <label className="field"><span>이메일</span>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={onKey} autoFocus />
        </label>
        {mode === "signup" && (
          <label className="field"><span>이름 (나눔에 표시될 이름)</span>
            <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={onKey} />
          </label>
        )}
        {mode !== "reset" && (
          <label className="field"><span>비밀번호</span>
            <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={onKey} />
          </label>
        )}
        {mode === "signup" && (
          <label className="field"><span>비밀번호 확인</span>
            <input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={onKey} />
          </label>
        )}
        {err && <p className="auth-err">{err}</p>}
        {info && <p className="auth-hint">{info}</p>}
        <button className="primary auth-submit" disabled={busy} onClick={go}>
          {busy ? "처리 중…" : mode === "login" ? "로그인" : mode === "signup" ? "계정 만들기" : "재설정 메일 보내기"}
        </button>
        {mode === "login" && (
          <p className="auth-note">비밀번호를 잊으셨나요? <button className="text-link" onClick={() => reset("reset")}>비밀번호 재설정</button></p>
        )}
        {mode === "reset" && (
          <p className="auth-note"><button className="text-link" onClick={() => reset("login")}>← 로그인으로 돌아가기</button></p>
        )}
      </div></div>
    </div>
  );
}

/* ── 문지기: 대문 → 로그인 → 앱 ── */
function AuthGate() {
  const [entered, setEntered] = useState(false);
  const [session, setSession] = useState(undefined);
  const [recovery, setRecovery] = useState(false);
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess || null);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);
  if (!entered) return <Landing onEnter={() => setEntered(true)} />;
  if (!sb) return <SetupScreen />;
  if (session === undefined) return <div className="app"><style>{CSS}</style><div className="auth-wrap"><p className="muted">불러오는 중…</p></div></div>;
  if (recovery && session) return <NewPasswordScreen onDone={() => setRecovery(false)} />;
  if (!session) return <LoginScreen />;
  const u = session.user;
  const profileName = (u.user_metadata && u.user_metadata.display_name) || u.email;
  return <MeditationApp user={u} profileName={profileName}
    onHome={() => setEntered(false)} onLogout={() => sb.auth.signOut()} />;
}

      : await sb.from("daily_words").insert([row]).select();
    if (res.error || !res.data || !res.data.length) {
      const m = res.error ? res.error.message : "";
      setWordErr(/duplicate|unique/i.test(m) ? "그 날짜에는 이미 말씀이 있습니다. 해당 날짜로 가서 '수정'을 눌러 주세요."
        : /row-level|permission|policy/i.test(m) ? "관리자 권한이 없습니다. SQL의 관리자 이메일을 확인해 주세요."
        : "저장 실패 — " + (m || "알 수 없는 오류"));
      return;
    }
    const saved = res.data[0];
    setWords((p) => [saved, ...p.filter((x) => x.id !== saved.id)].sort((a, b) => b.date.localeCompare(a.date)));
    setWordDate(saved.date);
    setWordForm(null); setWordErr("");
  };
  const deleteWord = async (w) => {
    if (!window.confirm(`${prettyDate(w.date)} 말씀을 삭제할까요? 이 말씀으로 쓴 묵상은 남습니다.`)) return;
    const { error } = await sb.from("daily_words").delete().eq("id", w.id);
    if (error) { setWordErr("삭제 실패 — " + error.message); return; }
    setWords((p) => p.filter((x) => x.id !== w.id));
  };
  useEffect(() => { fetchAll().then(() => setLoaded(true)); }, []);

  /* 내 묵상 = 내가 쓴 모든 묵상 / 함께 나눔 = 나눔으로 공개된 모든 묵상 */
  const scoped = useMemo(
    () => library === "personal" ? items.filter((x) => x.mine) : items.filter((x) => x.scope === "shared"),
    [items, library]
  );

  /* ── 묵상 습관 통계 ── */
  const stats = useMemo(() => {
    const mine = items.filter((x) => x.mine);
    const days = new Set(mine.map((x) => x.date).filter(Boolean));
    const ym = today().slice(0, 7);
    const monthDays = [...days].filter((d) => d.startsWith(ym)).length;
    /* 연속 일수: 오늘(없으면 어제)부터 거꾸로 */
    let streak = 0;
    const d = new Date();
    if (!days.has(d.toLocaleDateString("sv-SE"))) d.setDate(d.getDate() - 1);
    while (days.has(d.toLocaleDateString("sv-SE"))) { streak++; d.setDate(d.getDate() - 1); }
    return { total: mine.length, monthDays, streak, shared: mine.filter((x) => x.scope === "shared").length };
  }, [items]);

  const years = useMemo(() => {
    const ys = new Set(scoped.map((s) => (s.date || "").slice(0, 4)).filter(Boolean));
    return ["전체", ...[...ys].sort().reverse()];
  }, [scoped]);
  const allTags = useMemo(() => {
    const t = new Set(); scoped.forEach((s) => (s.tags || []).forEach((x) => t.add(x)));
    return ["전체", ...[...t].sort((a, b) => a.localeCompare(b, "ko"))];
  }, [scoped]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return scoped.filter((s) => {
      if (fYear !== "전체" && (s.date || "").slice(0, 4) !== fYear) return false;
      if (fTag !== "전체" && !(s.tags || []).includes(fTag)) return false;
      if (!q) return true;
      return [s.title, s.book, s.ref, s.verse, s.content, s.apply, s.prayer, s.author, (s.tags || []).join(" ")]
        .join(" ").toLowerCase().includes(q);
    });
  }, [scoped, query, fYear, fTag]);

  const amenCount = (id) => amens.filter((a) => a.meditation_id === id).length;
  const iAmened = (id) => amens.some((a) => a.meditation_id === id && a.user_id === user.id);

  /* ── 쓰기 / 고치기 / 지우기 ── */
  const startNew = () => {
    setForm({ ...EMPTY_FORM, date: today() });
    setEditingId(null);
    setSaveScope(library === "shared" ? "shared" : "personal");
    setView("form");
  };
  const startEdit = (s) => {
    setForm({ ...s, tags: (s.tags || []).join(", ") });
    setEditingId(s.id);
    setSaveScope(s.scope);
    setView("form");
  };
  const saveForm = async () => {
    if (!form.content.trim() && !form.title.trim()) return;
    const rec = {
      ...form,
      title: form.title.trim() || (form.book ? `${form.book} ${form.ref}`.trim() : "제목 없는 묵상"),
      tags: String(form.tags || "").split(",").map((t) => t.trim()).filter(Boolean),
    };
    const row = rowFrom(rec, saveScope, profileName);
    const res = editingId
      ? await sb.from("meditations").update(row).eq("id", editingId).select()
      : await sb.from("meditations").insert([row]).select();
    if (res.error || !res.data || !res.data.length) {
      setErr(res.error ? res.error.message : "저장 권한이 없거나 기록을 찾지 못했습니다");
      return;
    }
    const saved = recFrom(res.data[0], user.id);
    setItems((prev) => editingId ? prev.map((x) => (x.id === editingId ? saved : x)) : [saved, ...prev]);
    setErr("");
    setLibrary(saveScope === "shared" && library === "shared" ? "shared" : "personal");
    setOpenId(saved.id);
    setView(saved.wordId ? "today" : "list");
  };
  const remove = async (id) => {
    const { error } = await sb.from("meditations").delete().eq("id", id);
    if (error) { setErr(error.message); return; }
    setItems((prev) => prev.filter((x) => x.id !== id));
    setConfirmDel(null); setOpenId(null);
  };

  /* ── 아멘 / 댓글 ── */
  const toggleAmen = async (id) => {
    if (iAmened(id)) {
      const { error } = await sb.from("meditation_amens").delete().eq("meditation_id", id).eq("user_id", user.id);
      if (!error) setAmens((p) => p.filter((a) => !(a.meditation_id === id && a.user_id === user.id)));
    } else {
      const { error } = await sb.from("meditation_amens").insert([{ meditation_id: id }]);
      if (!error) setAmens((p) => [...p, { meditation_id: id, user_id: user.id }]);
      else setErr(error.message);
    }
  };
  const loadComments = async (id) => {
    const { data, error } = await sb.from("meditation_comments").select("*")
      .eq("meditation_id", id).order("created_at", { ascending: true });
    if (!error) setComments((p) => ({ ...p, [id]: data || [] }));
  };
  const addComment = async (id) => {
    const body = cleanText(commentInput[id] || "").trim();
    if (!body) return;
    const { data, error } = await sb.from("meditation_comments")
      .insert([{ meditation_id: id, author_name: cleanText(profileName), body }]).select();
    if (error) { setErr(error.message); return; }
    setComments((p) => ({ ...p, [id]: [...(p[id] || []), ...(data || [])] }));
    setCommentInput((p) => ({ ...p, [id]: "" }));
  };
  const deleteComment = async (mid, cid) => {
    const { error } = await sb.from("meditation_comments").delete().eq("id", cid);
    if (!error) setComments((p) => ({ ...p, [mid]: (p[mid] || []).filter((c) => c.id !== cid) }));
  };
  const toggleOpen = (s) => {
    const next = openId === s.id ? null : s.id;
    setOpenId(next);
    if (next && s.scope === "shared" && !comments[s.id]) loadComments(s.id);
  };

  /* ── 백업 / 가져오기 ── */
  const exportData = () => {
    const mine = items.filter((x) => x.mine);
    const blob = new Blob([JSON.stringify({ meditations: mine }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "묵상이음-백업-" + today() + ".json"; a.click();
    URL.revokeObjectURL(url);
  };
  const importData = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const arr = Array.isArray(data) ? data : (data.meditations || []);
      const rows = arr.filter((r) => r && (r.title || r.content))
        .map((r) => rowFrom(r, r.scope === "shared" ? "shared" : "personal", profileName));
      if (!rows.length) { setMsg("가져올 묵상이 없습니다."); return; }
      let ok = 0;
      for (let i = 0; i < rows.length; i += 5) {
        setMsg(`가져오는 중… ${Math.min(i + 5, rows.length)} / ${rows.length}`);
        const r = await sb.from("meditations").insert(rows.slice(i, i + 5)).select();
        if (!r.error && r.data) { ok += r.data.length; setItems((p) => [...r.data.map((x) => recFrom(x, user.id)), ...p]); }
      }
      setMsg(`완료 — ${ok}편을 가져왔습니다.`);
    } catch (err2) {
      setMsg("가져오기에 실패했습니다. 묵상이음 백업 파일(JSON)인지 확인해 주세요.");
    }
  };

  /* ── 지도용 집계 ── */
  const bookCounts = useMemo(() => {
    const m = {}; scoped.forEach((s) => { if (s.book) m[s.book] = (m[s.book] || 0) + 1; }); return m;
  }, [scoped]);
  const maxBook = Math.max(1, ...Object.values(bookCounts));
  const tagCounts = useMemo(() => {
    const m = {}; scoped.forEach((s) => (s.tags || []).forEach((t) => { m[t] = (m[t] || 0) + 1; })); return m;
  }, [scoped]);
  const tagList = Object.entries(tagCounts).sort((a, b) => a[0].localeCompare(b[0], "ko"));
  const maxTag = Math.max(1, ...Object.values(tagCounts));

  const label = (s) => s.book ? `${s.book}${s.ref ? " " + s.ref : ""}` : "본문 미기록";

  /* 지도 아래 목록 한 줄 */
  const MiniList = ({ list }) => (
    <ul>
      {list.map((s) => (
        <li key={s.id}>
          <button className="link" onClick={() => { setQuery(""); setFYear("전체"); setFTag("전체"); setView("list"); setOpenId(s.id); }}>
            <span className="scripture">{label(s)}</span> {s.title}
            <span className="date"> · {s.date || "날짜 없음"}{library === "shared" && s.author ? " · " + s.author : ""}</span>
          </button>
        </li>
      ))}
    </ul>
  );

  /* ── 묵상 카드 본문 ── */
  const Section = ({ name, text, cls }) => text ? (
    <div className={"med-sec " + (cls || "")}><b>{name}</b><div>{text}</div></div>
  ) : null;

  return (
    <div className="app">
      <style>{CSS}</style>

      <header className="masthead">
        <div className="masthead-inner">
          <div className="brand">
            <button className="shelf-btn" onClick={() => setMenuOpen(!menuOpen)} aria-label="작업 메뉴" aria-expanded={menuOpen}>
              <Mark size={36} />
            </button>
            <div className="brand-text">
              <h1>묵상이음</h1>
              <p className="brand-sub">{profileName}님, 오늘도 말씀 앞에</p>
            </div>
            <button className="logout-btn" onClick={onLogout}>로그아웃</button>
          </div>

          {menuOpen && (
            <div className="shelf-menu">
              <button onClick={() => { setMenuOpen(false); startNew(); }}>자유 묵상 쓰기</button>
              {isAdmin && (
                <button onClick={() => { setMenuOpen(false); setView("today"); setWordForm({ ...EMPTY_WORD, date: wordDate }); }}>말씀 올리기</button>
              )}
              <button onClick={() => { setMenuOpen(false); exportData(); }} disabled={!stats.total}>백업</button>
              <button onClick={() => { setMenuOpen(false); document.getElementById("import-input").click(); }}>가져오기</button>
              <button onClick={() => { setMenuOpen(false); fetchAll(); }}>새로 불러오기</button>
            </div>
          )}
          <input id="import-input" type="file" accept=".json" hidden onChange={importData} />

          <nav className="tabs">
            <button className={view === "today" ? "on" : ""} onClick={() => { setWordDate(today()); setView("today"); }}>오늘의 말씀</button>
            <button className={view === "list" ? "on" : ""} onClick={() => setView("list")}>묵상</button>
            <button className={view === "map" ? "on" : ""} onClick={() => { setMapBook(null); setView("map"); }}>성경 지도</button>
            <button className={view === "topics" ? "on" : ""} onClick={() => { setTopicSel(null); setView("topics"); }}>주제</button>
            <button className="new-btn" onClick={() => { const w = wordOf(today()); if (w) startFromWord(w); else startNew(); }}>+ 묵상 쓰기</button>
            <button className="home-btn" onClick={onHome}>대문</button>
          </nav>
        </div>
      </header>

      {view !== "today" && view !== "form" && (
        <div className="lib-bar">
          <div className="lib-inner">
            <button className={library === "personal" ? "on" : ""} onClick={() => setLibrary("personal")}>내 묵상</button>
            <button className={library === "shared" ? "on" : ""} onClick={() => setLibrary("shared")}>함께 나눔</button>
          </div>
        </div>
      )}

      {err && <div className="banner error">문제가 생겼습니다 — {err}</div>}
      {msg && <div className="banner">{msg}</div>}
      {!loaded && <div className="banner">묵상을 불러오는 중…</div>}

      {/* ───────── 오늘의 말씀 ───────── */}
      {loaded && view === "today" && (() => {
        const w = currentWord;
        const myOnWord = w ? items.find((x) => x.mine && x.wordId === w.id) : null;
        const sharedOnWord = w ? items.filter((x) => x.scope === "shared" && x.wordId === w.id) : [];
        const isToday = wordDate === today();
        return (
          <main className="container narrow">
            <div className="day-nav">
              <button className="ghost" onClick={() => setWordDate(shiftDate(wordDate, -1))} aria-label="전날">◀</button>
              <div className="day-label">
                <b>{isToday ? "오늘의 말씀" : "그날의 말씀"}</b>
                <span>{prettyDate(wordDate)}</span>
              </div>
              <button className="ghost" onClick={() => setWordDate(shiftDate(wordDate, 1))} aria-label="다음날">▶</button>
            </div>
            {!isToday && (
              <p className="day-back"><button className="text-link" onClick={() => setWordDate(today())}>오늘로 돌아가기</button></p>
            )}

            {wordErr && <p className="auth-err" style={{ marginBottom: 14 }}>{wordErr}</p>}

            {w ? (
              <section className="word-card">
                <p className="word-ref">{wordLabel(w)}</p>
                <div className="word-text">{w.verse}</div>
                <p className="word-source">{BIBLE_SOURCE}</p>
                {w.guide && (
                  <div className="word-guide"><b>묵상 도움</b><div>{w.guide}</div></div>
                )}
                <button className="primary word-go" onClick={() => startFromWord(w)}>
                  {myOnWord ? "내 묵상 고치기" : "이 말씀으로 묵상하기"}
                </button>
                {isAdmin && (
                  <div className="word-admin">
                    <button className="ghost" onClick={() => setWordForm({ ...EMPTY_WORD, ...w, guide: w.guide || "" })}>말씀 수정</button>
                    <button className="ghost danger-text" onClick={() => deleteWord(w)}>말씀 삭제</button>
                  </div>
                )}
              </section>
            ) : (
              <div className="empty">
                <p className="empty-title">이 날에는 아직 말씀이 올라오지 않았습니다.</p>
                <p>{isAdmin ? "아래 '이 날 말씀 올리기'를 눌러 말씀을 넣어 주세요." : "말씀이 올라오면 이곳에서 함께 묵상할 수 있습니다. 그동안은 메뉴의 '자유 묵상 쓰기'를 이용해 주세요."}</p>
              </div>
            )}

            {isAdmin && !w && !wordForm && (
              <button className="primary" style={{ width: "100%" }} onClick={() => setWordForm({ ...EMPTY_WORD, date: wordDate })}>
                + 이 날 말씀 올리기
              </button>
            )}

            {isAdmin && wordForm && (
              <section className="word-form">
                <h3>{wordForm.id ? "말씀 수정" : "말씀 올리기"} <small>관리자</small></h3>
                <div className="row">
                  <label className="field"><span>날짜</span>
                    <input type="date" value={wordForm.date} onChange={(e) => setWordForm({ ...wordForm, date: e.target.value })} />
                  </label>
                  <label className="field"><span>성경</span>
                    <select value={wordForm.book} onChange={(e) => setWordForm({ ...wordForm, book: e.target.value })}>
                      <option value="">선택</option>
                      <optgroup label="구약">{OT_BOOKS.map((b) => <option key={b}>{b}</option>)}</optgroup>
                      <optgroup label="신약">{NT_BOOKS.map((b) => <option key={b}>{b}</option>)}</optgroup>
                    </select>
                  </label>
                  <label className="field"><span>장·절</span>
                    <input value={wordForm.ref} onChange={(e) => setWordForm({ ...wordForm, ref: e.target.value })} placeholder="예: 23:1-3" />
                  </label>
                </div>
                <label className="field"><span>말씀 (저작권을 위해 몇 절 정도만 넣어 주세요)</span>
                  <textarea rows={5} value={wordForm.verse} onChange={(e) => setWordForm({ ...wordForm, verse: e.target.value })}
                    placeholder="여호와는 나의 목자시니 내게 부족함이 없으리로다 …" />
                </label>
                <label className="field"><span>묵상 도움 (질문이나 짧은 안내, 비워도 됩니다)</span>
                  <textarea rows={3} value={wordForm.guide} onChange={(e) => setWordForm({ ...wordForm, guide: e.target.value })}
                    placeholder="예: 오늘 나에게 '부족함'으로 느껴지는 것은 무엇인가요?" />
                </label>
                <div className="form-actions">
                  <button className="primary" onClick={saveWord}>{wordForm.id ? "수정 저장" : "말씀 올리기"}</button>
                  <button className="ghost" onClick={() => { setWordForm(null); setWordErr(""); }}>취소</button>
                </div>
              </section>
            )}

            {w && (
              <section className="word-shared">
                <h3>함께 나눈 묵상 <small>{sharedOnWord.length}편</small></h3>
                {sharedOnWord.length === 0 ? (
                  <p className="muted">아직 나눈 묵상이 없습니다. 첫 번째로 받은 은혜를 나눠 주세요.</p>
                ) : (
                  <ul className="shared-list">
                    {sharedOnWord.map((s) => (
                      <li key={s.id}>
                        <button onClick={() => { setLibrary("shared"); setQuery(""); setFYear("전체"); setFTag("전체"); setView("list"); setOpenId(s.id); if (!comments[s.id]) loadComments(s.id); }}>
                          <span className="sh-head">
                            <b>{s.author || "이름 없음"}</b>
                            {amenCount(s.id) > 0 && <span className="pill amen">아멘 {amenCount(s.id)}</span>}
                          </span>
                          <span className="sh-title">{s.title}</span>
                          {s.content && <span className="peek">{s.content}</span>}
                        </button>
                      </li>
                    ))}
                  </ul>
                )}
              </section>
            )}

            {isAdmin && words.length > 0 && (
              <section className="word-shared">
                <h3>올린 말씀 <small>관리자만 보입니다 · 최근 {Math.min(words.length, 14)}개</small></h3>
                <ul className="admin-words">
                  {words.slice(0, 14).map((x) => (
                    <li key={x.id}>
                      <button className="link" onClick={() => setWordDate(x.date)}>
                        <span className="date">{prettyDate(x.date)}</span> <span className="scripture">{wordLabel(x)}</span>
                      </button>
                    </li>
                  ))}
                </ul>
              </section>
            )}
          </main>
        );
      })()}

      {/* ───────── 묵상 목록 ───────── */}
      {loaded && view === "list" && (
        <main className="container">
          {library === "personal" && (
            <div className="stat-row">
              <div className="stat"><b>{stats.streak}<i>일</i></b><span>연속 묵상</span></div>
              <div className="stat"><b>{stats.monthDays}<i>일</i></b><span>이번 달 묵상한 날</span></div>
              <div className="stat"><b>{stats.total}</b><span>전체 묵상</span></div>
              <div className="stat"><b>{stats.shared}</b><span>나눈 묵상</span></div>
            </div>
          )}

          <div className="toolbar">
            <input className="search" placeholder="말씀·묵상·적용·기도·이름으로 검색"
              value={query} onChange={(e) => setQuery(e.target.value)} />
            <div className="filters">
              <select value={fYear} onChange={(e) => setFYear(e.target.value)}>
                {years.map((y) => <option key={y} value={y}>{y === "전체" ? "연도: 전체" : y + "년"}</option>)}
              </select>
              <select value={fTag} onChange={(e) => setFTag(e.target.value)}>
                {allTags.map((t) => <option key={t} value={t}>{t === "전체" ? "주제: 전체" : "#" + t}</option>)}
              </select>
            </div>
          </div>

          <p className="count-line">
            {scoped.length ? `${filtered.length}편 표시 · ${library === "personal" ? "내 묵상" : "함께 나눔"} ${scoped.length}편` : ""}
          </p>

          {scoped.length === 0 && (
            <div className="empty">
              <p className="empty-title">{library === "personal" ? "아직 기록한 묵상이 없습니다." : "아직 나눔에 올라온 묵상이 없습니다."}</p>
              <p>위의 <b>+ 묵상 쓰기</b>를 눌러 오늘 받은 말씀을 적어 보세요.<br />
              나눔으로 공개하면 함께하는 지체들이 읽고 <b>아멘</b>과 댓글로 응답할 수 있습니다.</p>
            </div>
          )}

          <ul className="cards">
            {filtered.map((s) => {
              const open = openId === s.id;
              return (
                <li key={s.id} className={"card" + (open ? " open" : "")}>
                  <button className="card-head" onClick={() => toggleOpen(s)}>
                    <div className="card-main">
                      <span className="scripture">{label(s)}</span>
                      <span className="card-title">{s.title}</span>
                      {!open && s.content && <span className="peek">{s.content}</span>}
                    </div>
                    <div className="card-meta">
                      {s.wordId && <span className="pill word">오늘의 말씀</span>}
                      {library === "shared" && <span className="pill author">{s.author || "이름 없음"}</span>}
                      {library === "personal" && s.scope === "shared" && <span className="pill shared">나눔</span>}
                      {s.scope === "shared" && amenCount(s.id) > 0 && <span className="pill amen">아멘 {amenCount(s.id)}</span>}
                      <span className="date">{s.date || "날짜 없음"}</span>
                    </div>
                  </button>

                  {open && (
                    <div className="card-body">
                      <Section name={s.wordId ? "오늘의 말씀" : "말씀"} text={s.verse} cls="verse" />
                      {s.verse && <p className="word-source" style={{ marginTop: -6 }}>{BIBLE_SOURCE}</p>}
                      <Section name="묵상" text={s.content} />
                      <Section name="적용" text={s.apply} />
                      <Section name="기도" text={s.prayer} cls="prayer" />
                      {(s.tags || []).length > 0 && (
                        <div className="tag-row">
                          {s.tags.map((t) => <button key={t} className="tag" onClick={() => { setFTag(t); setOpenId(null); }}>#{t}</button>)}
                        </div>
                      )}

                      {s.scope === "shared" && (
                        <div className="share-box">
                          <button className={"amen-btn" + (iAmened(s.id) ? " on" : "")} onClick={() => toggleAmen(s.id)}>
                            🙏 아멘 {amenCount(s.id) || ""}
                          </button>
                          <ul className="comments">
                            {(comments[s.id] || []).map((c) => (
                              <li key={c.id}>
                                <b>{c.author_name || "이름 없음"}</b>
                                <span>{c.body}</span>
                                {c.user_id === user.id && (
                                  <button className="text-link danger-text" onClick={() => deleteComment(s.id, c.id)}>지우기</button>
                                )}
                              </li>
                            ))}
                          </ul>
                          <div className="comment-input">
                            <input placeholder="격려와 응답을 남겨주세요"
                              value={commentInput[s.id] || ""}
                              onChange={(e) => setCommentInput((p) => ({ ...p, [s.id]: e.target.value }))}
                              onKeyDown={(e) => { if (e.key === "Enter") addComment(s.id); }} />
                            <button className="ghost" onClick={() => addComment(s.id)}>남기기</button>
                          </div>
                        </div>
                      )}

                      <div className="card-actions">
                        {s.mine ? (
                          <>
                            <button className="ghost" onClick={() => startEdit(s)}>수정</button>
                            {confirmDel === s.id ? (
                              <span className="confirm">정말 삭제할까요?
                                <button className="danger" onClick={() => remove(s.id)}>삭제</button>
                                <button className="ghost" onClick={() => setConfirmDel(null)}>취소</button>
                              </span>
                            ) : (
                              <button className="ghost danger-text" onClick={() => setConfirmDel(s.id)}>삭제</button>
                            )}
                          </>
                        ) : (
                          <span className="muted">{s.author ? s.author + "님의 묵상" : "다른 지체의 묵상"}</span>
                        )}
                      </div>
                    </div>
                  )}
                </li>
              );
            })}
          </ul>
          {scoped.length > 0 && filtered.length === 0 && (
            <div className="empty"><p>조건에 맞는 묵상이 없습니다. 검색어나 필터를 바꿔보세요.</p></div>
          )}
        </main>
      )}

      {/* ───────── 쓰기 / 수정 ───────── */}
      {loaded && view === "form" && (
        <main className="container narrow">
          <h2 className="page-title">{editingId ? "묵상 수정" : "오늘의 묵상"}</h2>

          <div className="row">
            <label className="field"><span>날짜</span>
              <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
            </label>
            <label className="field"><span>공개 범위</span>
              <select value={saveScope} onChange={(e) => setSaveScope(e.target.value)}>
                <option value="personal">나만 보기</option>
                <option value="shared">함께 나눔 (모든 지체에게 공개)</option>
              </select>
            </label>
          </div>

          {form.wordId && (
            <div className="word-card compact">
              <p className="word-ref">오늘의 말씀 · {form.book}{form.ref ? " " + form.ref : ""}</p>
              <div className="word-text">{form.verse}</div>
              <p className="word-source">{BIBLE_SOURCE}</p>
              {(() => { const w = words.find((x) => x.id === form.wordId); return w && w.guide
                ? <div className="word-guide"><b>묵상 도움</b><div>{w.guide}</div></div> : null; })()}
            </div>
          )}

          {!form.wordId && (<>
          <div className="row">
            <label className="field"><span>본문 성경</span>
              <select value={form.book} onChange={(e) => setForm({ ...form, book: e.target.value })}>
                <option value="">선택</option>
                <optgroup label="구약">{OT_BOOKS.map((b) => <option key={b}>{b}</option>)}</optgroup>
                <optgroup label="신약">{NT_BOOKS.map((b) => <option key={b}>{b}</option>)}</optgroup>
              </select>
            </label>
            <label className="field"><span>장·절</span>
              <input value={form.ref} onChange={(e) => setForm({ ...form, ref: e.target.value })} placeholder="예: 23:1-6" />
            </label>
          </div>

          <label className="field"><span>붙잡은 말씀 (마음에 머문 한두 절 정도만 적어 주세요)</span>
            <textarea rows={3} value={form.verse} onChange={(e) => setForm({ ...form, verse: e.target.value })}
              placeholder="오늘 마음에 머문 구절을 적어 보세요." />
          </label>
          </>)}

          <label className="field"><span>제목 (비우면 본문 말씀으로 채워집니다)</span>
            <input value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="예: 부족함이 없는 삶" />
          </label>
          <label className="field"><span>묵상 — 말씀이 내게 하신 말씀</span>
            <textarea rows={8} value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })}
              placeholder="깨달은 것, 느낀 것, 하나님은 어떤 분이신지…" />
          </label>
          <label className="field"><span>적용 — 오늘 살아낼 한 가지</span>
            <textarea rows={3} value={form.apply} onChange={(e) => setForm({ ...form, apply: e.target.value })} />
          </label>
          <label className="field"><span>기도</span>
            <textarea rows={3} value={form.prayer} onChange={(e) => setForm({ ...form, prayer: e.target.value })} />
          </label>
          <label className="field"><span>주제 (쉼표로 구분)</span>
            <input value={form.tags} onChange={(e) => setForm({ ...form, tags: e.target.value })} placeholder="예: 신뢰, 평안, 감사" />
          </label>

          <div className="form-actions">
            <button className="primary" disabled={!form.content.trim() && !form.title.trim()} onClick={saveForm}>
              {editingId ? "수정 저장" : "저장"}
            </button>
            <button className="ghost" onClick={() => setView(form.wordId ? "today" : "list")}>취소</button>
          </div>
        </main>
      )}

      {/* ───────── 성경 지도 ───────── */}
      {loaded && view === "map" && (
        <main className="container">
          <h2 className="page-title">성경 지도</h2>
          <p className="map-sub">{library === "personal" ? "내가" : "공동체가"} 묵상한 말씀이 성경 어디에 머물렀는지 보여줍니다. 색이 진할수록 자주 묵상한 책입니다.</p>
          {BIBLE_SECTIONS.map((sec) => {
            const total = sec.groups.reduce((a, g) => a + g.books.reduce((b, n) => b + (bookCounts[n] || 0), 0), 0);
            return (
              <section key={sec.testament} className="testament">
                <h3 className="testament-head"><span className="testament-name">{sec.testament}</span><span className="testament-count">{total}편</span></h3>
                <div className="bible-columns">
                  {sec.groups.map((g) => (
                    <div key={g.name}>
                      <div className="group-name">{g.name}</div>
                      <div className="book-grid">
                        {g.books.map((name) => {
                          const c = bookCounts[name] || 0;
                          const inv = c / maxBook > 0.5;
                          return (
                            <button key={name} className={"book-cell" + (mapBook === name ? " sel" : "")}
                              style={{ background: heat(c, maxBook) }}
                              onClick={() => setMapBook(mapBook === name ? null : name)}>
                              <span className={"book-name" + (inv ? " inv" : "")}>{name}</span>
                              <span className={"book-num" + (inv ? " inv" : "")}>{c || ""}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            );
          })}
          {mapBook && (
            <div className="detail">
              <h3>{mapBook} <small>{bookCounts[mapBook] || 0}편</small></h3>
              {(bookCounts[mapBook] || 0) === 0
                ? <p className="muted">아직 이 책으로 묵상한 기록이 없습니다.</p>
                : <MiniList list={scoped.filter((s) => s.book === mapBook)} />}
            </div>
          )}
        </main>
      )}

      {/* ───────── 주제 ───────── */}
      {loaded && view === "topics" && (
        <main className="container">
          <h2 className="page-title">주제</h2>
          <p className="map-sub">묵상에 붙인 주제들입니다. 눌러서 그 주제로 묵상한 글을 모아 보세요.</p>
          {tagList.length === 0 ? (
            <div className="empty"><p>아직 주제가 붙은 묵상이 없습니다. 묵상을 쓸 때 주제를 적어 보세요.</p></div>
          ) : (
            <div className="book-grid">
              {tagList.map(([t, c]) => (
                <button key={t} className={"book-cell" + (topicSel === t ? " sel" : "")}
                  style={{ background: heat(c, maxTag) }} onClick={() => setTopicSel(topicSel === t ? null : t)}>
                  <span className={"book-name" + (c / maxTag > 0.5 ? " inv" : "")}>{t}</span>
                  <span className={"book-num" + (c / maxTag > 0.5 ? " inv" : "")}>{c}</span>
                </button>
              ))}
            </div>
          )}
          {topicSel && (
            <div className="detail">
              <h3>#{topicSel} <small>{tagCounts[topicSel]}편</small></h3>
              <MiniList list={scoped.filter((s) => (s.tags || []).includes(topicSel))} />
            </div>
          )}
        </main>
      )}

      <footer className="foot">묵상은 온라인 서버에 저장되어 어느 기기에서나 로그인하면 이어집니다. 가끔 메뉴의 '백업'도 해 두세요.</footer>
    </div>
  );
}

.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#eef2ef;border:none;color:#3f5a50;font-size:12.5px;padding:4px 10px;border-radius:12px}

.share-box{background:#faf8f2;border:1px solid #ece4cf;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.amen-btn{align-self:flex-start;border:1px solid #e3d3a8;background:#fff;color:#7a5c1d;border-radius:18px;padding:6px 14px;font-size:13.5px}
.amen-btn.on{background:linear-gradient(#c9a44e,#8f6d24);color:#fff;border-color:transparent;font-weight:700}
.comments{list-style:none;display:flex;flex-direction:column;gap:6px}
.comments li{font-size:13.5px;line-height:1.6;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.comments b{color:var(--green)}
.comment-input{display:flex;gap:8px}
.comment-input input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}

.card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--danger)}
.muted{color:var(--muted);font-size:13.5px}
button.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13.5px;color:var(--ink)}
button.danger{background:var(--danger);border:none;color:#fff;border-radius:8px;padding:7px 14px;font-size:13.5px}
.danger-text{color:var(--danger)!important}
button.primary{background:var(--ink-deep);color:#fff;border:none;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:700}
button.primary:disabled{opacity:.4;cursor:not-allowed}
button.link{background:none;border:none;text-align:left;font-size:14.5px;padding:6px 0;color:var(--ink);line-height:1.5}
button.link:hover{text-decoration:underline}
.text-link{background:none;border:none;color:var(--accent);font-size:12.5px;text-decoration:underline;padding:0}

.field{display:flex;flex-direction:column;gap:6px;margin-top:16px;flex:1}
.field span{font-size:13px;font-weight:700;color:#4a5a52}
.field input,.field select,.field textarea{padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-family:inherit}
.field textarea{resize:vertical;line-height:1.75}
.row{display:flex;gap:12px}
.form-actions{display:flex;gap:10px;margin-top:24px}

.empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:14.5px;line-height:1.9}
.empty-title{font-family:'Noto Serif KR',serif;font-size:19px;color:var(--ink);margin-bottom:10px}

.testament{margin-bottom:22px;padding:16px 18px 6px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.testament-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;padding-bottom:9px;border-bottom:2px solid var(--accent)}
.testament-name{font-family:'Noto Serif KR',serif;font-size:19px}
.testament-count{font-size:13px;color:var(--muted)}
.bible-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.group-name{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:7px}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;margin-bottom:16px}
.book-cell{position:relative;overflow:hidden;border:none;border-radius:14px;min-height:52px;padding:10px 5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 -5px 9px rgba(0,0,0,.08) inset,0 4px 10px rgba(28,40,34,.14);transition:transform .15s}
.book-cell::before{content:"";position:absolute;inset:0;height:52%;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,.5),rgba(255,255,255,0))}
.book-cell:hover{transform:translateY(-2px)}
.book-cell.sel{box-shadow:0 0 0 2.5px var(--accent),0 6px 14px rgba(168,128,47,.25)}
.book-name{position:relative;font-size:12px;font-weight:600;color:var(--ink);word-break:keep-all}
.book-num{position:relative;font-size:11.5px;font-weight:700;color:var(--accent)}
.book-name.inv,.book-num.inv{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.detail h3{font-family:'Noto Serif KR',serif;font-size:18px;margin-bottom:8px}
.detail h3 small{font-size:13px;color:var(--muted);font-weight:400}
.detail ul{list-style:none}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:16px}

/* 대문 */
.landing{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px 90px;background:radial-gradient(120% 90% at 50% 20%,#fbf8ef 0%,#e8efe9 55%,#cfdcd3 100%);
  font-family:'Noto Sans KR',sans-serif}
.landing-inner{text-align:center;color:var(--green)}
.landing-mark{display:inline-block;line-height:0;border-radius:24px;margin-bottom:24px;box-shadow:0 18px 36px rgba(31,61,53,.28)}
.landing-eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;letter-spacing:.42em;color:#6f8a7f;margin-bottom:14px;font-weight:600}
.landing-eyebrow::before,.landing-eyebrow::after{content:"";height:1px;width:52px;background:#9fb5ab}
.landing-inner h1{font-family:'Noto Serif KR',serif;font-size:60px;font-weight:700;color:#1f3d35;letter-spacing:.06em}
.landing-sub{margin-top:14px;color:#5d7a6f;font-size:16px;letter-spacing:.3em}
.enter-btn{margin-top:44px;display:inline-flex;align-items:center;gap:12px;border:none;color:#fff;
  background:linear-gradient(#3d6b5d,#1f3d35);font-size:19px;font-weight:700;letter-spacing:.12em;
  padding:16px 36px;border-radius:40px;box-shadow:0 14px 30px rgba(31,61,53,.32)}
.enter-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.landing-foot{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:12px;line-height:1.9;color:#5d7a6f}

/* 계정 */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;width:100%;max-width:400px}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand svg{border-radius:15px}
.auth-brand h1{font-family:'Noto Serif KR',serif;font-size:24px;margin:8px 0 4px}
.auth-brand p{font-size:12.5px;color:var(--muted)}
.auth-tabs{display:flex;gap:6px;background:#eef1ee;border-radius:10px;padding:4px;margin-bottom:6px}
.auth-tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-size:14px;color:var(--muted)}
.auth-tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-hint{font-size:13px;color:#7a5c1d;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-top:10px}
.auth-err{font-size:13px;color:var(--danger);background:#fbe9e6;border-radius:8px;padding:8px 12px;margin-top:14px}
.auth-submit{width:100%;margin-top:18px}
.auth-note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}

@media (max-width:640px){
  .tabs{display:grid;grid-template-columns:repeat(3,1fr)}
  .word-text{font-size:16.5px}
  .tabs button{padding:8px 4px;font-size:12.5px}
  .tabs .home-btn{margin-left:0}
  .row{flex-direction:column;gap:0}
  .card-head{flex-direction:column;gap:6px}
  .card-meta{justify-content:flex-start}
  .bible-columns{grid-template-columns:1fr;gap:6px}
  .stat{min-width:calc(50% - 5px)}
  .landing-inner h1{font-size:42px}
  .landing-sub{font-size:13.5px;letter-spacing:.22em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
`;
